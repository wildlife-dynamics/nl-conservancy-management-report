id: nl_conservancy_management_report
requirements:
- name: ecoscope-platform
  version: '>=2.28.0, <2.29.0'
  channel: https://repo.prefix.dev/ecoscope-workflows/
- name: ecoscope-workflows-ext-custom
  version: 0.1.5
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: pydeck
  version: 0.9.2
  channel: conda-forge
# For draw_incident_sunburst (Fig. MIKE cause and type of death). Same package
# and version the HWC report already pins, so the two repos resolve the same
# environment. Its known Windows bug is in format_incident_storyboards, which
# this workflow does not use.
- name: ecoscope-workflows-ext-wd
  version: 0.0.14
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
rjsf-overrides:
  properties:
    # Review: "allow users to select up to five species during report
    # configuration... prioritise elephant, lion, wild dog and leopard". The
    # names are the report's harmonised English species names (the part of the
    # ER label before " / ").
    priority_species.properties.vars.title: Priority species
    priority_species.properties.vars.description: >-
      Up to five species to map with symbols sized by the number of individuals
      seen. Use the English name as it appears in the report, e.g. Elephant,
      Lion, Wild Dog, Leopard, Reticulated Giraffe, Grevys Zebra.
    priority_species.properties.vars.default:
    - Elephant
    - Lion
    - Wild Dog
    - Leopard
    priority_species.properties.vars.maxItems: 5
    # `set_string_var`'s only argument is `var`, declared with `Field(title="")`,
    # so the run form had nothing to label it with and fell back to the argument
    # name.
    prepared_by.properties.var.title: Prepared by
    prepared_by.properties.var.description: >-
      Type in the name of the user preparing the analysis - this will appear in
      the report.
    # THE PERIOD GROUPING IS A FORM FIELD, NOT A PINNED CONSTANT.
    #
    # Review: "please can you add the temporal grouper to the config instead of
    # having it encoded within the workflow". It used to be
    # `partial: {groupers: [{temporal_index: '%Y-%m'}]}` on set_groupers, which
    # hard-wired one view per calendar month and gave the run form nothing to
    # set.
    #
    # Constrained to TemporalGrouper, the same way incidents_reports constrains
    # its own field to ValueGrouper. Without this the field offers Value and
    # Spatial groupers too, and either one would split on a column this
    # workflow never builds -- a run-time failure on a choice the form invited.
    #
    # The default keeps month-by-month as the out-of-box behaviour, so an
    # untouched form produces exactly the report that was there before.
    groupers.properties.groupers.title: Report period grouping
    groupers.properties.groupers.description: >-
      How the report is broken down. Year and Month gives one view per calendar
      month, which is what a monthly management report expects. Leave empty for
      a single view covering the whole time range.
    groupers.properties.groupers.default:
    - temporal_index: '%Y-%m'
    groupers.properties.groupers.items.anyOf:
    - $ref: '#/$defs/TemporalGrouper'
    base_map_defs.properties.base_maps.default:
    - url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}
      opacity: 1
    - url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
      opacity: 0.5
task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
workflow:
- name: Workflow Details
  id: workflow_details
  task: set_workflow_details
- name: Data Source
  id: er_client_name
  task: set_er_connection
- name: Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y'
- name: Extract Timezone
  id: get_timezone
  task: get_timezone_from_time_range
  partial:
    time_range: ${{ workflow.time_range.return }}

- name: Prepared By
  id: prepared_by
  task: set_string_var
- name: Base Maps
  id: base_map_defs
  task: set_base_maps

- name: Group by
  id: groupers
  task: set_groupers
- name: Priority Species
  id: priority_species
  task: set_list_of_string_vars
- title: Fetch Events
  type: task-group
  description: All events in the period; sections select their event types in SQL.
  tasks:
  - name: Get Events
    id: events_raw
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_types: []
      event_columns: null
      event_states: null
      include_null_geometry: true
      raise_on_empty: false
      include_details: true
      include_updates: false
      include_related_events: false
      include_display_values: true
      force_point_geometry: true
  - name: Process Event Details
    id: events_details
    task: process_events_details
    partial:
      df: ${{ workflow.events_raw.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true
      ordered: true
  - name: Events or Empty Frame
    id: events_safe
    task: concat_dataframes
    skipif:
      conditions: &id002
      - never
    partial:
      dfs:
      - ${{ workflow.events_details.return }}
      reset_index: true
      ensure_columns:
      - id
      - serial_number
      - event_type
      - event_type_display
      - event_category
      - event_details
      - patrols
      - geometry
      - time
      - title
  # SQL notes:
  # type_key: the event type's fixed-colour key (the event_type_colors map
  # below), by event type CODE so display-name spelling cannot break it;
  # 'Other' for types without one. Every figure that shows event types draws
  # each one in the same colour.
  # HARMONISED EVENT TYPE NAME. Review: "Legacy and new categories
  # display as separate types e.g. 'Wildlife Sighting' (Ranger Basic)
  # vs 'Field Monitoring' - map legacy events to the new display name
  # + remove the category suffix everywhere". ecoscope appends
  # " (<category>)" whenever two event types share a display name,
  # which is exactly the legacy/current pair. Every category display
  # on the instance is stripped here, and the two legacy types that
  # still hold unmigrated records are named as their current forms.
  # THE PERIOD FILTER. Review: "It seems to have pulled data outside
  # the chosen time range". An event is fetched by its EarthRanger
  # time, which is always inside the range; its form's own incident
  # date need not be. The incident date is used only when it falls
  # inside the range actually fetched (bounded by the first and last
  # EarthRanger time in this frame -- apply_sql_query cannot see the
  # configured dates); otherwise the EarthRanger time is, so no event
  # can land in a month before or after the report period.
  # Not counted as field events: logistics, device check-ins (Silent
  # Source), test forms, meeting forms, and legacy records that were
  # migrated to a new type (the copy names its original in
  # additional.migrated_from_event_id).
  # species_h: the animal RESPONSIBLE (HWC forms). animal_h: the animal
  # seen, found dead or hurt (sightings, carcasses, sick / injured).
  # "Hyena - Spotted" -> "Spotted Hyena"
  # ER labels are bilingual ("Lion / Simba"): keep the English half.
  # Carcass and Sick / Injured choice labels are long ("Conflict -
  # fill in relevant HWC form", "Problem Animal Control / Management").
  # RECORDS MARKED FOR DELETION ARE LEFT OUT. Rangers flag reports to be
  # removed by putting "delete" in the title (e.g. a batch of HWC Threat forms
  # titled "...delete"); nobody has deleted them in ER yet. Any event whose
  # title contains "delet" (any case) is dropped here, before anything is
  # counted, so no card, table, map or widget can include it -- and so is any
  # migrated COPY of such an event, since copies carry no title of their own.
  # Checked 17 Nov 2026: the marker is only ever in the title (never notes or
  # form fields); 45 events -- 42 "HWC Threat delete", 3 "Livestock Theft
  # delete" whose Theft copies are 3 of the 4 January cluster. No patrol is
  # marked. Data Checks reports how many were dropped.
  - name: Prepare Events
    id: events_prepared
    task: apply_sql_query
    skipif:
      conditions: &id001
      - any_dependency_skipped
    partial:
      df: ${{ workflow.events_safe.return }}
      query: |
        SELECT *,
           CASE event_type
            WHEN 'hwc_livestock_predation' THEN 'HWC Livestock Predation' WHEN 'crop_damage' THEN 'Crop Damage'
            WHEN 'infrastructure_damage' THEN 'Infrastructure Damage' WHEN 'human_injury' THEN 'Human Injury'
            WHEN 'human_death' THEN 'Human Death' WHEN 'wildlife_sighting' THEN 'Wildlife Sighting'
            WHEN 'wildlife_sighting_rep_ranger' THEN 'Wildlife Sighting' WHEN 'animal_carcass' THEN 'Animal Carcass'
            WHEN 'sick_injured_animal' THEN 'Sick / Injured Animal' WHEN 'hwc_threat' THEN 'HWC Threat'
            WHEN 'hwc_mitigation_response' THEN 'HWC Mitigation Response' WHEN 'hwc_retaliation' THEN 'HWC Retaliation'
            WHEN 'illegal_activity' THEN 'Illegal Activity' WHEN 'illegal_activity_rep' THEN 'Illegal Activity'
            WHEN 'illegal_activity_rep_ranger' THEN 'Illegal Activity' WHEN 'theft' THEN 'Theft'
            WHEN 'snares_traps' THEN 'Snares & Traps' WHEN 'poacher_camp' THEN 'Poacher Camp'
            WHEN 'poacher_spoor' THEN 'Poacher Spoor (Human & Vehicle)' WHEN 'gunshot' THEN 'Gunshot'
            WHEN 'arrest' THEN 'Arrest' WHEN 'contact' THEN 'Contact (human-human)' WHEN 'poisoning' THEN 'Poisoning'
            WHEN 'recovered_trophy' THEN 'Recovered trophy' WHEN 'rainfall_rep' THEN 'Rainfall Report'
            ELSE 'Other' END AS type_key
        FROM (
        SELECT id, serial_number, event_type, event_category,
           event_details, patrols, geometry,
           CASE event_type
            WHEN 'wildlife_sighting_rep_ranger' THEN 'Wildlife Sighting'
            WHEN 'illegal_activity_rep_ranger' THEN 'Illegal Activity'
            ELSE TRIM(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(
                event_type_display,
                ' (Rhino Management (Archived))', ''), ' (Rhino Management)', ''), ' (Ranger Basic)', ''),
                ' (Field Monitoring)', ''), ' (Animal Health)', ''), ' (HWC)', ''), ' (Security)', ''),
                ' (Bio And Eco Monitoring)', ''), ' (Operations)', ''), ' (Veterinary)', ''),
                ' (Rangeland Management)', ''), ' (Rangeland Monitoring)', ''), ' (Analyzer Event)', ''),
                ' (Standard Reporting (Deprecated))', ''), ' (Findrep)', ''), ' (Legal)', ''),
                ' (Accident & Emergency)', ''), ' (Archive)', ''))
           END AS event_type_display,
           strftime('%Y-%m-%dT%H:%M:%SZ', time) AS er_time,
           strftime('%Y-%m-%dT%H:%M:%SZ', CASE
            WHEN inc_time IS NOT NULL
               AND julianday(inc_time) >= julianday((SELECT MIN(time) FROM df))
               AND julianday(inc_time) <= julianday((SELECT MAX(time) FROM df))
            THEN inc_time ELSE time END) AS report_time,
           CASE WHEN event_category IN ('logistics', 'analyzer_event', 'test')
               OR event_type IN ('test_patrol_info', 'patrol_info', 'meeting_rep', 'meeting_report',
                        'rangeland_meeting_rep', 'livestock_household_survey',
                        'livestock_survey_quest', 'silence_source_rep')
               OR id IN (SELECT json_extract(event_details, '$."additional"."migrated_from_event_id"') FROM df
                    WHERE json_extract(event_details, '$."additional"."migrated_from_event_id"') IS NOT NULL)
              THEN 0 ELSE 1 END AS counted,
           CASE
            WHEN event_type = 'hwc_livestock_predation' THEN 1
            WHEN event_type = 'human_injury' AND json_extract(event_details, '$."Cause of injury"') = 'Human-wildlife conflict' THEN 1
            WHEN event_type = 'human_death' AND json_extract(event_details, '$."Cause"') = 'Human-wildlife conflict' THEN 1
            WHEN event_type IN ('crop_damage', 'infrastructure_damage') AND json_extract(event_details, '$."Cause of damage"') = 'Wildlife' THEN 1
            WHEN event_type IN ('animal_carcass', 'sick_injured_animal') AND death_type = 'Conflict' THEN 1
            WHEN event_type = 'poisoning' AND json_extract(event_details, '$."Suspected motive"') = 'HWC retaliation' THEN 1
            ELSE 0
           END AS is_conflict,
           CASE event_type
            WHEN 'hwc_livestock_predation' THEN 'Livestock predation'
            WHEN 'human_injury' THEN 'Human injury'
            WHEN 'human_death' THEN 'Human death'
            WHEN 'crop_damage' THEN 'Crop damage'
            WHEN 'infrastructure_damage' THEN 'Infrastructure damage'
            WHEN 'animal_carcass' THEN 'Wildlife death'
            WHEN 'sick_injured_animal' THEN 'Wildlife injury'
            WHEN 'poisoning' THEN 'Poisoning'
            ELSE event_type_display
           END AS conflict_type,
           CASE WHEN event_type IN ('hwc_livestock_predation', 'crop_damage', 'infrastructure_damage',
                        'human_injury', 'human_death') THEN sp_h ELSE 'Unknown' END AS species_h,
           CASE WHEN event_type IN ('animal_carcass', 'sick_injured_animal', 'wildlife_sighting') THEN sp_h END AS animal_h,
           death_type,
           COALESCE(json_extract(event_details, '$."Cause of Death (CONFLICT)"'), json_extract(event_details, '$."Cause of Injury (CONFLICT)"'),
                json_extract(event_details, '$."Cause of Death (POACHED)"'), json_extract(event_details, '$."Cause of Injury (POACHED)"'),
                json_extract(event_details, '$."Cause of Death (PAC)"'), json_extract(event_details, '$."Cause of Injury (PAC)"'),
                json_extract(event_details, '$."Cause of Death (NATURAL)"'), json_extract(event_details, '$."Cause of Injury (NATURAL)"'),
                json_extract(event_details, '$."Cause of Injury (UNKNOWN)"'),
                json_extract(event_details, '$."Cause of Death"'), json_extract(event_details, '$."Cause of Injury"')) AS wl_cause,
           CASE WHEN COALESCE(json_extract(event_details, '$."Retaliation action taken?"'), json_extract(event_details, '$."Retaliation action taken"'))
                IN (1, 'true', 'True', 'Yes') THEN 1 ELSE 0 END AS ret_taken,
           CASE WHEN COALESCE(json_extract(event_details, '$."Retaliation action threatened?"'), json_extract(event_details, '$."Retaliation action threatened"'))
                IN (1, 'true', 'True', 'Yes') THEN 1 ELSE 0 END AS ret_threatened,
           NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(CAST(COALESCE(json_extract(event_details, '$."Action"'),
            json_extract(event_details, '$."Action taken"'), json_extract(event_details, '$."Action Taken"')) AS TEXT),
            '","', ', '), '["', ''), '"]', ''), '[]', '')), '') AS action_txt
        FROM (
         SELECT *,
            CASE
             WHEN sp2 IS NULL OR sp2 = '' THEN 'Unknown'
             WHEN LOWER(sp2) IN ('baboon, olive', 'baboon olive', 'olive baboon') THEN 'Olive Baboon'
             WHEN LOWER(sp2) IN ('hyena, spotted', 'hyena spotted', 'spotted hyena') THEN 'Spotted Hyena'
             WHEN LOWER(sp2) IN ('hyena, striped', 'hyena striped', 'striped hyena') THEN 'Striped Hyena'
             WHEN LOWER(sp2) IN ('zebra, burchells', 'burchells zebra') THEN 'Burchells Zebra'
             WHEN LOWER(sp2) IN ('zebra, grevys', 'grevys zebra', 'grevy''s zebra') THEN 'Grevys Zebra'
             WHEN LOWER(sp2) IN ('gazelle, grants', 'grants gazelle') THEN 'Grants Gazelle'
             WHEN LOWER(sp2) IN ('gazelle, thompsons', 'thompsons gazelle') THEN 'Thompsons Gazelle'
             WHEN LOWER(sp2) IN ('kudu, lesser', 'lesser kudu') THEN 'Lesser Kudu'
             WHEN LOWER(sp2) IN ('kudu, greater', 'greater kudu') THEN 'Greater Kudu'
             WHEN LOWER(sp2) IN ('jackal, side striped', 'side striped jackal', 'side-striped jackal') THEN 'Side-striped Jackal'
             WHEN LOWER(sp2) IN ('jackal, black backed', 'black backed jackal', 'black-backed jackal') THEN 'Black-backed Jackal'
             ELSE UPPER(SUBSTR(sp2, 1, 1)) || SUBSTR(sp2, 2)
            END AS sp_h
         FROM (
          SELECT *, CASE WHEN INSTR(sp1, ' - ') > 0
                 THEN TRIM(SUBSTR(sp1, INSTR(sp1, ' - ') + 3)) || ' ' || TRIM(SUBSTR(sp1, 1, INSTR(sp1, ' - ') - 1))
                 ELSE sp1 END AS sp2
          FROM (
           SELECT *, TRIM(CASE WHEN INSTR(sp_raw, ' / ') > 0 THEN SUBSTR(sp_raw, 1, INSTR(sp_raw, ' / ') - 1) ELSE sp_raw END) AS sp1,
              CASE WHEN event_type IN ('animal_carcass', 'sick_injured_animal') THEN
               CASE WHEN dt LIKE 'Poach%' THEN 'Poached' WHEN dt LIKE 'Conflict%' THEN 'Conflict'
                  WHEN dt LIKE 'Natural%' THEN 'Natural' WHEN dt LIKE 'Problem Animal%' OR dt LIKE 'PAC%' THEN 'PAC/Management'
                  ELSE 'Unknown' END END AS death_type
           FROM (
            SELECT *,
               CASE
                WHEN event_type IN ('human_injury', 'crop_damage', 'infrastructure_damage') THEN json_extract(event_details, '$."Incident date & time"')
                WHEN event_type = 'poisoning' THEN json_extract(event_details, '$."Date & time"')
                WHEN event_type = 'arrest' THEN json_extract(event_details, '$."Arrest time"')
                WHEN event_type = 'contact' THEN json_extract(event_details, '$."Contact time"')
               END AS inc_time,
               CASE WHEN event_type IN ('human_injury', 'human_death')
                   THEN COALESCE(json_extract(event_details, '$."Species responsible"'), json_extract(event_details, '$."Species Responsible"'))
                  ELSE json_extract(event_details, '$."Species"') END AS sp_raw,
               COALESCE(json_extract(event_details, '$."Type of Death"'), json_extract(event_details, '$."Type of Injury"')) AS dt
            FROM df
            WHERE LOWER(COALESCE(title, '')) NOT LIKE '%delet%'
              AND COALESCE(json_extract(event_details, '$."additional"."migrated_from_event_id"'), '')
                  NOT IN (SELECT id FROM df WHERE LOWER(COALESCE(title, '')) LIKE '%delet%')
           )
          )
         )
        )
        )
      columns: null
      sanitize: true
  - name: Parse Report Time
    id: events_time
    task: extract_column_as_type
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.events_prepared.return }}
      column_name: report_time
      output_type: datetime
      output_column_name: report_time
      fan_out: true
  - name: Parse EarthRanger Time
    id: events_er_time
    task: extract_column_as_type
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.events_time.return }}
      column_name: er_time
      output_type: datetime
      output_column_name: er_time
      fan_out: true
  - name: Convert Events to Timezone
    id: events_tz
    task: convert_values_to_timezone
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.events_er_time.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
      - report_time
      - er_time
      auto_detect: false
  # THE REPORT PERIOD AS DATA. apply_sql_query sees only its dataframe, and
  # nothing carries the configured since/until into SQL, so the period is taken
  # as the first and last EarthRanger time among everything fetched for it
  # (Silent Source check-ins alone arrive several times a day, so the bounds sit
  # within hours of the configured dates). In local time, which is what the
  # month boundaries and the partial-month check need. One row; never skipped,
  # so an empty period gives NULL bounds and every clamp below becomes a no-op.
  - name: Report Period Bounds
    id: period_bounds
    task: apply_sql_query
    skipif:
      conditions: *id002
    partial:
      df: ${{ workflow.events_tz.return }}
      query: |
        SELECT MIN(er_time) AS period_lo, MAX(er_time) AS period_hi FROM df
      columns: null
      sanitize: true
  - name: Add Event Month Index
    id: events_indexed
    task: add_temporal_index
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.events_tz.return }}
      time_col: report_time
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed
  - name: Split Events by Month
    id: events_grouped
    task: split_groups
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.events_indexed.return }}
      groupers: ${{ workflow.groupers.return }}
# THE CONSERVANCY BOUNDARY, for every map's extent and outline.
#
# Review: "Fix the map extent to the conservancy boundary... Include the
# boundary polygon, scale bar, north arrow and readable legend across all
# maps." draw_ecomap already adds the scale bar and north arrow; what it lacked
# was something to zoom to. Every map now carries this outline with zoom: true
# and its data layers with zoom: false, so the view is the conservancy whatever
# the points are -- one sighting typed at 0,0 can no longer pull the map out to
# the whole of Africa, which is what Fig. 3.1 in the review copy showed.
#
# EMBEDDED, NOT FETCHED. The outline is the "Naibunga Lower" feature (type
# Conservancy) of the instance's "Boundaries" featureset, simplified from 4,325
# vertices to 101 (Douglas-Peucker, 0.00035 degrees ~ 38 m; area within 0.2%).
# ext-custom's get_featureset could fetch it live, but it is not io-tagged, so
# --mock-io cannot mock it and every CI test case would try to reach
# EarthRanger. If the boundary is redrawn in ER, regenerate this polygon.
#
# Built in SQL from a constant, on the events frame only because
# apply_sql_query returns a GeoDataFrame (geometry parsed from WKT) when its
# input is one. Skipped on a period with no events, which takes the outline
# off that run's maps but nothing else.
- title: Conservancy Boundary
  type: task-group
  description: The Naibunga Lower boundary polygon, used as every map's extent.
  tasks:
  - name: Naibunga Lower Boundary
    id: boundary
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_safe.return }}
      query: |
        SELECT 'Naibunga Lower' AS "Area",
               'POLYGON ((36.96877 0.46700, 36.96581 0.47236, 36.92512 0.44412, 36.90968 0.43648, 36.90846 0.43907, ' ||
               '36.89936 0.43708, 36.89767 0.44192, 36.89881 0.44312, 36.89780 0.44562, 36.89776 0.45083, ' ||
               '36.89820 0.45203, 36.90109 0.45368, 36.90131 0.45449, 36.89796 0.45684, 36.89472 0.46105, ' ||
               '36.89490 0.46326, 36.89411 0.46594, 36.89440 0.46756, 36.89335 0.47039, 36.89369 0.47326, ' ||
               '36.89088 0.47550, 36.89134 0.48060, 36.88856 0.48373, 36.88795 0.48902, 36.88669 0.48989, ' ||
               '36.88490 0.49251, 36.88384 0.49597, 36.87742 0.49647, 36.87746 0.49781, 36.87930 0.49844, ' ||
               '36.87984 0.50007, 36.87910 0.50311, 36.87691 0.50490, 36.87642 0.50661, 36.87682 0.50823, ' ||
               '36.87580 0.50961, 36.87399 0.51078, 36.87110 0.51090, 36.86790 0.51193, 36.86594 0.51384, ' ||
               '36.86744 0.51726, 36.86675 0.52019, 36.86937 0.52430, 36.86863 0.52565, 36.86908 0.52842, ' ||
               '36.86862 0.53065, 36.86794 0.53221, 36.86440 0.53577, 36.86388 0.53749, 36.85915 0.54519, ' ||
               '36.85738 0.55207, 36.85825 0.55324, 36.86325 0.55363, 36.86513 0.55512, 36.86542 0.55672, ' ||
               '36.86472 0.55891, 36.86524 0.56437, 36.86479 0.56583, 37.04914 0.54651, 37.04873 0.54442, ' ||
               '37.04997 0.54020, 37.04900 0.53731, 37.05053 0.53505, 37.05089 0.53317, 37.03783 0.52969, ' ||
               '37.03732 0.52865, 37.03603 0.52896, 37.02973 0.52637, 37.02997 0.52523, 37.02935 0.52458, ' ||
               '37.02707 0.52342, 37.02240 0.52220, 37.01850 0.51927, 37.01468 0.51377, 37.01287 0.51228, ' ||
               '37.01121 0.51214, 37.00806 0.51342, 37.00316 0.51374, 37.00085 0.51276, 37.00087 0.50190, ' ||
               '36.99794 0.50168, 36.99415 0.50037, 36.99208 0.49913, 36.99084 0.49733, 36.98292 0.49714, ' ||
               '36.98466 0.49367, 36.98879 0.48808, 36.98880 0.48499, 36.98931 0.48450, 36.98897 0.48375, ' ||
               '36.98627 0.48054, 36.98607 0.47845, 36.98372 0.47596, 36.98225 0.47284, 36.98065 0.47228, ' ||
               '36.98017 0.47083, 36.97829 0.46996, 36.97752 0.47023, 36.97673 0.46953, 36.97749 0.46560, ' ||
               '36.96877 0.46700))' AS geometry
        FROM (SELECT 1)
      columns: null
      sanitize: true
  - name: Boundary Layer
    id: boundary_layer
    task: create_polygon_layer
    partial:
      geodataframe: ${{ workflow.boundary.return }}
      layer_style:
        filled: false
        stroked: true
        get_line_color: [26, 26, 26, 255]
        get_line_width: 2
        line_width_units: pixels
        pickable: false
      legend:
        labels: [Conservancy boundary]
        colors: ['#1a1a1a']
      tooltip_columns: []
      zoom: true
- title: Fetch Patrols
  type: task-group
  description: All done patrols in the period, with their GPS tracks.
  tasks:
  - name: Set Patrol Query
    id: patrol_params
    task: set_patrols_and_patrol_events_params
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      patrol_types: []
      event_types: []
      status:
      - done
      event_states: null
      include_patrol_details: true
      raise_on_empty: false
      include_null_geometry: true
      truncate_to_time_range: true
      sub_page_size: 100
      patrols_overlap_daterange: true
  - name: Get Patrols
    id: patrols_raw
    task: get_patrols_from_combined_params
    partial:
      combined_params: ${{ workflow.patrol_params.return }}
  - name: Get Patrol Observations
    id: patrol_obs
    task: get_patrol_observations_from_patrols_df_and_combined_params
    partial:
      patrols_df: ${{ workflow.patrols_raw.return }}
      combined_params: ${{ workflow.patrol_params.return }}
  - name: Remove Observation Prefix
    id: patrol_obs_clean
    task: drop_column_prefix
    partial:
      df: ${{ workflow.patrol_obs.return }}
      prefix: extra__
      duplicate_strategy: suffix
  - name: Filter Observation Coordinates
    id: patrol_obs_filtered
    task: apply_reloc_coord_filter
    partial:
      df: ${{ workflow.patrol_obs_clean.return }}
      roi_gdf: null
      roi_name: null
      reset_index: false
      bounding_box:
        min_x: -180.0
        max_x: 180.0
        min_y: -90.0
        max_y: 90.0
      filter_point_coords:
      - x: 180.0
        y: 90.0
      - x: 0.0
        y: 0.0
      - x: 1.0
        y: 1.0
  - name: Patrol Trajectories
    id: patrol_traj
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.patrol_obs_filtered.return }}
      trajectory_segment_filter:
        min_length_meters: 0.001
        max_length_meters: 100000
        min_time_secs: 1
        max_time_secs: 172800
        min_speed_kmhr: 0.01
        max_speed_kmhr: 500
  - name: Remove Trajectory Prefix
    id: patrol_traj_clean
    task: drop_column_prefix
    partial:
      df: ${{ workflow.patrol_traj.return }}
      prefix: extra__
      duplicate_strategy: suffix
- title: Patrol Table
  type: task-group
  description: 'One row per patrol: type, duration, distance and patrol details.'
  tasks:
  - name: Tracks or Empty Frame
    id: traj_safe
    task: concat_dataframes
    skipif:
      conditions: *id002
    partial:
      dfs:
      - ${{ workflow.patrol_traj_clean.return }}
      reset_index: false
      ensure_columns:
      - patrol_id
      - patrol_type__display
      - patrol_serial_number
      - speed_kmhr
      - dist_meters
      - timespan_seconds
      - segment_start
      - segment_end
      - geometry
  - name: Convert Tracks to Timezone
    id: traj_tz
    task: convert_values_to_timezone
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.traj_safe.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
      - segment_start
      - segment_end
      auto_detect: false
  - name: Attach Report Period to Tracks
    id: traj_period
    task: ecoscope_workflows_ext_custom.tasks.transformation.merge_two_dataframes
    skipif:
      conditions:
      - any_dependency_skipped
    partial:
      left: ${{ workflow.traj_tz.return }}
      right: ${{ workflow.period_bounds.return }}
      how: cross
      'on': null
      left_on: null
      right_on: null
      left_index: false
      right_index: false
      fillna_value: null
  # Track segments inside the period only. A patrol's observations are fetched
  # for its whole own time window, not the report's, so a patrol left open from
  # December into January used to bring its December track (and distance) with
  # it. patrol_key is the patrol type when it has a fixed colour, 'Other'
  # otherwise -- the same three colours as Fig. "Patrol distance per month".
  - name: Tracks Inside the Period
    id: traj_in
    task: apply_sql_query
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.traj_period.return }}
      query: |
        SELECT patrol_id, patrol_type__display, patrol_serial_number, speed_kmhr,
               dist_meters, timespan_seconds, segment_start, segment_end, geometry,
               CASE WHEN patrol_type__display IN ('Routine Patrol', 'Motorbike Patrol', 'Joint Operations Mobile Patrol')
                    THEN patrol_type__display ELSE 'Other' END AS patrol_key
        FROM df
        WHERE COALESCE(patrol_type__display, '') <> 'Test Patrol'
          AND (period_lo IS NULL
               OR (julianday(segment_start) >= julianday(period_lo) AND julianday(segment_start) <= julianday(period_hi)))
      columns: null
      sanitize: true
  - name: Patrols or Empty Frame
    id: patrols_safe
    task: concat_dataframes
    skipif:
      conditions: *id002
    partial:
      dfs:
      - ${{ workflow.patrols_raw.return }}
      reset_index: true
      ensure_columns:
      - id
      - serial_number
      - title
      - patrol_segments
  - name: Patrol Track Totals
    id: patrol_tracks
    task: apply_sql_query
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.traj_in.return }}
      query: |
        SELECT patrol_id,
               MAX(patrol_type__display) AS patrol_type,
               COUNT(*) AS n_segments,
               SUM(dist_meters) / 1000.0 AS distance_km,
               SUM(timespan_seconds) / 3600.0 AS tracked_hours
        FROM df GROUP BY patrol_id
      columns: null
      sanitize: true
  # SQL notes:
  # GROUP BY id: one row per patrol even if a page boundary in the ER
  # patrol listing hands the same patrol over twice.
  # PATROL DETAILS LIVE ON THE PATROL NOW. Team leader, team members,
  # mandate, transport type and station used to come only from a separate
  # report form linked to the patrol (event type test_patrol_info, first used
  # 25 Apr 2026). Since 18 Nov 2026 EarthRanger records them on the patrol
  # itself, in patrol_segments[0].segment_details, as raw choice keys
  # ('micka', 'foot', 'monitoring'); the CASEs here turn them into the same
  # display names the form used (choice lists checked in ER 19 Nov 2026).
  # Mandate is a single value there, a list on the form; both are handled.
  # Build Patrol Table prefers these and falls back to the form. The report
  # calls both "patrol details" and never names the old form.
  - name: Patrol Serials
    id: patrols_master
    task: apply_sql_query
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrols_safe.return }}
      query: |
        SELECT id AS patrol_id, MAX(serial_number) AS patrol_serial, MAX(title) AS patrol_title,
               MAX(json_extract(patrol_segments, '$[0].patrol_type')) AS patrol_type_slug,
               MAX(json_extract(patrol_segments, '$[0].time_range.start_time')) AS start_raw,
               MAX(json_extract(patrol_segments, '$[0].time_range.end_time')) AS end_raw,
               MAX(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(REPLACE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(CAST(json_extract(patrol_segments, '$[0].segment_details.mandate') AS TEXT), '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'community_engagement', 'Community Engagement'), 'human_wildlife_conflict', 'Human-Wildlife conflict'), 'rangeland_management', 'Rangeland Management'), 'monitoring', 'Wildlife Monitoring'), 'routine', 'Routine'), 'security', 'Security')) AS sd_mandate,
               MAX(CASE json_extract(patrol_segments, '$[0].segment_details.transport_type') WHEN 'foot' THEN 'Foot' WHEN 'motorbike' THEN 'Motorbike'
                     WHEN 'vehicle' THEN 'Vehicle' ELSE json_extract(patrol_segments, '$[0].segment_details.transport_type') END) AS sd_transport,
               MAX(CASE json_extract(patrol_segments, '$[0].segment_details.station') WHEN 'hq' THEN 'HQ' WHEN 'koija_starbeds' THEN 'Koija Starbeds'
                     WHEN 'ndonyoruma' THEN 'Ndonyoruma' WHEN 'other' THEN 'Other' ELSE json_extract(patrol_segments, '$[0].segment_details.station') END) AS sd_station,
               MAX(CASE json_extract(patrol_segments, '$[0].segment_details.team_leader')
                     WHEN 'edung' THEN 'Edung Mosienye' WHEN 'micka' THEN 'Mika Yiangere'
                     WHEN 'henet' THEN 'Henet Manyaas' WHEN 'other' THEN 'Other'
                     ELSE json_extract(patrol_segments, '$[0].segment_details.team_leader') END) AS sd_leader,
               MAX(json(json_extract(patrol_segments, '$[0].segment_details.team_members'))) AS sd_members,
               MAX(CASE WHEN json_type(json_extract(patrol_segments, '$[0].segment_details')) = 'object'
                         AND json_extract(patrol_segments, '$[0].segment_details') <> '{}' THEN 1 ELSE 0 END) AS has_patrol_details
        FROM df WHERE LOWER(COALESCE(title, '')) NOT LIKE '%delet%' GROUP BY id
      columns: null
      sanitize: true
  - name: Patrol Details from the Earlier Report Form
    id: patrol_info
    task: apply_sql_query
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.events_prepared.return }}
      query: |
        SELECT json_extract(patrols, '$[0]') AS patrol_id,
               MAX(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(CAST(json_extract(event_details, '$."Mandate"') AS TEXT),
                   '","', ', '), '["', ''), '"]', ''), '[]', '')), '')) AS mandate,
               MAX(json_extract(event_details, '$."Station"')) AS station,
               MAX(json_extract(event_details, '$."Transport Type"')) AS transport,
               MAX(json_extract(event_details, '$."Team Leader"')) AS team_leader,
               MAX(json(json_extract(event_details, '$."Team members"'))) AS team_members,
               1 AS has_patrol_info
        FROM df
        WHERE event_type IN ('test_patrol_info', 'patrol_info') AND json_array_length(patrols) > 0
        GROUP BY 1
      columns: null
      sanitize: true
  - name: Join Track Totals
    id: patrols_tracks
    task: ecoscope_workflows_ext_custom.tasks.transformation.merge_two_dataframes
    skipif:
      conditions:
      - any_dependency_skipped
    partial:
      left: ${{ workflow.patrols_master.return }}
      right: ${{ workflow.patrol_tracks.return }}
      how: left
      'on': patrol_id
      left_on: null
      right_on: null
      left_index: false
      right_index: false
      fillna_value: null
  - name: Join Patrol Details
    id: patrols_info
    task: ecoscope_workflows_ext_custom.tasks.transformation.merge_two_dataframes
    skipif:
      conditions:
      - any_dependency_skipped
    partial:
      left: ${{ workflow.patrols_tracks.return }}
      right: ${{ workflow.patrol_info.return }}
      how: left
      'on': patrol_id
      left_on: null
      right_on: null
      left_index: false
      right_index: false
      fillna_value: null
  - name: Attach Report Period
    id: patrols_period
    task: ecoscope_workflows_ext_custom.tasks.transformation.merge_two_dataframes
    skipif:
      conditions:
      - any_dependency_skipped
    partial:
      left: ${{ workflow.patrols_info.return }}
      right: ${{ workflow.period_bounds.return }}
      how: cross
      'on': null
      left_on: null
      right_on: null
      left_index: false
      right_index: false
      fillna_value: null
  # CLAMPED TO THE PERIOD AND CAPPED AT 14 HOURS.
  #
  # Clamped: patrols are fetched when they OVERLAP the range, so a patrol begun
  # on 30 December arrived with a December start and put a December row in a
  # January-November report (review: "table 1 starts from 2025-12"). Its start
  # and end are now cut to the period bounds, so it counts in January for the
  # part of it that fell inside.
  #
  # Capped: review: "The statistics are distorted by patrols left open (11,562.8
  # hours across 317 patrols = approximately 36.5 hours per patrol). Suggest
  # capping patrol duration at 14 hours for effort calculations." Patrols that
  # rangers forget to close run on for days; 61 of 317 did over Jan-Nov 2026.
  # Each one now contributes at most 14 hours (open_over_14h keeps the flag for
  # the data completeness table and the footnote). start_time stays UTC ISO
  # whichever bound wins, so the column parses as one format downstream.
  - name: Build Patrol Table
    id: patrol_table
    task: apply_sql_query
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrols_period.return }}
      query: |
        SELECT patrol_id, patrol_serial, patrol_title,
               COALESCE(patrol_type, CASE patrol_type_slug WHEN 'routine_patrol' THEN 'Routine Patrol'
                 WHEN 'bicycle_patrol' THEN 'Motorbike Patrol' WHEN 'joint_ops_mobile_patrol' THEN 'Joint Operations Mobile Patrol'
                 ELSE patrol_type_slug END, 'Unknown') AS patrol_type,
               strftime('%Y-%m-%dT%H:%M:%SZ', start_c) AS start_time,
               ROUND(COALESCE(distance_km, 0), 3) AS distance_km,
               ROUND(MIN(COALESCE(span_h, tracked_hours, 0), 14.0), 3) AS duration_h,
               ROUND(COALESCE(span_h, tracked_hours, 0), 3) AS duration_uncapped_h,
               CASE WHEN COALESCE(span_h, tracked_hours, 0) > 14.0 THEN 1 ELSE 0 END AS open_over_14h,
               period_lo, period_hi,
               COALESCE(n_segments, 0) AS n_segments,
               CASE WHEN has_details = 0 THEN 'No patrol details' ELSE COALESCE(sd_mandate, mandate, 'Not recorded') END AS mandate,
               CASE WHEN has_details = 0 THEN 'No patrol details' ELSE COALESCE(sd_transport, transport, 'Not recorded') END AS transport,
               CASE WHEN has_details = 0 THEN 'No patrol details' ELSE COALESCE(sd_station, station, 'Not recorded') END AS station,
               CASE WHEN has_details = 0 THEN 'No patrol details' ELSE COALESCE(sd_leader, team_leader, 'Not recorded') END AS team_leader,
               COALESCE(sd_members, team_members) AS team_members,
               has_details AS has_patrol_info
        FROM (
          SELECT *, MAX((julianday(end_c) - julianday(start_c)) * 24.0, 0.0) AS span_h,
                 CASE WHEN COALESCE(has_patrol_details, 0) = 1 OR COALESCE(has_patrol_info, 0) = 1 THEN 1 ELSE 0 END AS has_details
          FROM (
            SELECT *,
                   CASE WHEN period_lo IS NOT NULL AND julianday(start_raw) < julianday(period_lo)
                        THEN period_lo ELSE start_raw END AS start_c,
                   CASE WHEN end_raw IS NULL THEN NULL
                        WHEN period_hi IS NOT NULL AND julianday(end_raw) > julianday(period_hi)
                        THEN period_hi ELSE end_raw END AS end_c
            FROM df
          )
        )
        WHERE COALESCE(patrol_type_slug, '') <> 'test_patrol'
      columns: null
      sanitize: true
  - name: Parse Patrol Start
    id: patrol_table_time
    task: extract_column_as_type
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrol_table.return }}
      column_name: start_time
      output_type: datetime
      output_column_name: start_time
      fan_out: true
  - name: Convert Patrols to Timezone
    id: patrol_table_tz
    task: convert_values_to_timezone
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrol_table_time.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
      - start_time
      auto_detect: false
  - name: Add Patrol Month Index
    id: patrols_indexed
    task: add_temporal_index
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrol_table_tz.return }}
      time_col: start_time
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed
  - name: Split Patrols by Month
    id: patrols_grouped
    task: split_groups
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrols_indexed.return }}
      groupers: ${{ workflow.groupers.return }}
  - name: Patrol Type Colours
    id: traj_colors
    task: apply_color_map
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.traj_in.return }}
      input_column_name: patrol_key
      colormap: &patrol_type_colors
        Routine Patrol: '#1b9e77'
        Motorbike Patrol: '#d95f02'
        Joint Operations Mobile Patrol: '#7570b3'
        Other: '#8a8f98'
      output_column_name: patrol_type_color
  - name: Add Track Month Index
    id: traj_indexed
    task: add_temporal_index
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.traj_colors.return }}
      time_col: segment_start
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed
  - name: Split Tracks by Month
    id: traj_grouped
    task: split_groups
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.traj_indexed.return }}
      groupers: ${{ workflow.groupers.return }}
