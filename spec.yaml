    id: crop_damage
    task: apply_sql_query
    partial:
      query: |
        SELECT COALESCE(NULLIF(TRIM(CASE WHEN INSTR(c, ' / ') > 0 THEN SUBSTR(c, 1, INSTR(c, ' / ') - 1) ELSE c END), ''), 'Unspecified') AS "Crop type",
               COALESCE(json_extract(event_details, '$."Extent of damage"'), 'Unspecified') AS "Extent of damage",
               COUNT(*) AS "Incidents"
        FROM (
          SELECT *, TRIM(REPLACE(REPLACE(REPLACE(REPLACE(CAST(json_extract(event_details, '$."Type of crop"') AS TEXT),
                      '","', ', '), '["', ''), '"]', ''), '[]', '')) AS c
          FROM df WHERE event_type = 'crop_damage' AND is_conflict = 1
