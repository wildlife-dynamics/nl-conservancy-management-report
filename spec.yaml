    id: mandate_tbl_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.mandate_tbl_w.return }}
  # SQL notes:
  # ONE NAME PER RANGER. Review: "Ranger names vary... 'Edung Mosienye' /
  # 'Edung Mosieny', 'Micka' / 'Mika Yiangere'". They are not typos in the
  # records: the patrol details take Team Leader and Team members from two
  # separate ER choice lists, and the same person is spelled differently
  # in each (leader list: Edung Mosienye, Micka Yiangere; member list:
  # Edung Mosieny, Mika Yiangere). Each choice is mapped to one name here;
  # the lasting fix is one shared list in ER. 'Other' on the leader list
  # means the leader was not on it, so it is shown as such, not as a
  # person.
  #
  # DISTINCT (patrol, ranger) before summing, so a leader also ticked as a
  # team member under the other spelling is credited once, not twice.
  # Each patrol's distance and (capped) time is credited in full to
  # every team member, so this table does not sum to the patrol totals --
  # the report says so under it.
  - name: Ranger Summary
    id: ranger_summary
    task: apply_sql_query
    partial:
      query: |
        SELECT ranger AS "Ranger", COUNT(*) AS "Patrols",
               printf('%,d.%d', CAST(ROUND(COALESCE(SUM(distance_km), 0) * 10) AS INTEGER) / 10, CAST(ROUND(COALESCE(SUM(distance_km), 0) * 10) AS INTEGER) % 10) AS "Distance (km)",
               printf('%,d.%d', CAST(ROUND(COALESCE(SUM(duration_h), 0) * 10) AS INTEGER) / 10, CAST(ROUND(COALESCE(SUM(duration_h), 0) * 10) AS INTEGER) % 10) AS "Time on patrol (h)"
        FROM (
          SELECT DISTINCT patrol_id,
                 CASE TRIM(raw)
                   WHEN 'Edung Mosieny' THEN 'Edung Mosienye'
                   WHEN 'edung' THEN 'Edung Mosienye'
                   WHEN 'edung_mosieny' THEN 'Edung Mosienye'
                   WHEN 'Micka Yiangere' THEN 'Mika Yiangere'
                   WHEN 'Micka' THEN 'Mika Yiangere'
                   WHEN 'micka' THEN 'Mika Yiangere'
                   WHEN 'mika_yiangere' THEN 'Mika Yiangere'
                   WHEN 'henet' THEN 'Henet Manyaas'
                   WHEN 'henet_manyaas' THEN 'Henet Manyaas'
                   WHEN 'Other' THEN 'Other (not on the list)'
                   WHEN 'other' THEN 'Other (not on the list)'
                   WHEN 'angelyne_mesia' THEN 'Angelyne Meisa'
                   WHEN 'daniel_naiptari' THEN 'Daniel Naiptari'
                   WHEN 'frangs_sapuro' THEN 'Frangs Sapuro'
                   WHEN 'jane_lesadela' THEN 'Jane Lesadela'
                   WHEN 'janet_mosieny' THEN 'Janet Sadela'
                   WHEN 'jeremiah_yangere' THEN 'Jeremiah Yangere'
                   WHEN 'jonathan_parkirewua' THEN 'Jonathan Parkirewua'
                   WHEN 'joseph_kinder' THEN 'Joseph Kinder'
                   WHEN 'joshua_mosiany' THEN 'Joshua Mosiany'
                   WHEN 'joyce_naiputari' THEN 'Joyce Naiputari'
                   WHEN 'kaniki_meshami' THEN 'Kaniki Meshami'
                   WHEN 'mary_sanguya' THEN 'Mary Sanguya'
                   WHEN 'naiputari_lumatenken' THEN 'Naiputari'
                   WHEN 'peter_kermui' THEN 'Peter Kermui'
                   WHEN 'robert_karkuli' THEN 'Robert Karkuli'
                   WHEN 'samuel_leshao' THEN 'Samuel Leshao'
                   WHEN 'samuel_meshami' THEN 'Samuel Meshami'
                   WHEN 'silamo_siangau' THEN 'Silamo Siangau'
                   WHEN 'simpiri_alex' THEN 'Simpiri Alex'
                   WHEN 'solomon_parkirewa' THEN 'Solomon Parkirewa'
                   WHEN 'thomson_mosiany' THEN 'Thomson Mosieny'
                   WHEN 'tony_lekerisae' THEN 'Tony Lekerisae'
                   WHEN 'wamae_karkuli' THEN 'Wamae Karkuli'
                   ELSE TRIM(raw)
                 END AS ranger,
                 distance_km, duration_h
          FROM (
            -- Team leader plus up to twelve team members per patrol, read by
            -- position rather than with json_each, which the task's SQLite
            -- sandbox may refuse to construct.
            SELECT patrol_id, team_leader AS raw, distance_km, duration_h FROM df WHERE team_leader NOT IN ('No patrol details', 'Not recorded')
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[0]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[1]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[2]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[3]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[4]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[5]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[6]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[7]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[8]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[9]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[10]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[11]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
          ) AS roster
          WHERE raw IS NOT NULL AND TRIM(raw) <> ''
        ) AS credited
        GROUP BY ranger ORDER BY CASE WHEN ranger LIKE 'Other%' THEN 1 ELSE 0 END, SUM(distance_km) DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.patrols_grouped.return }}
  - name: Draw Effort by Ranger Table
    id: ranger_tbl
    task: draw_table
    partial:
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: false
        enable_download: true
        hide_header: false
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.ranger_summary.return }}
  - name: Persist Effort by Ranger Table
    id: ranger_tbl_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: ranger_table
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.ranger_tbl.return }}
  - name: Effort by Ranger Table Widget
    id: ranger_tbl_w
    task: create_table_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Effort by Ranger
    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.ranger_tbl_html.return }}
  - name: Merge Effort by Ranger Table Views
    id: ranger_tbl_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.ranger_tbl_w.return }}
