      widgets: ${{ workflow.ah_kpi_1_sv.return }}
  - name: Animal Health by Cause
    id: ah_by_cause
    task: apply_sql_query
    partial:
      query: |
        SELECT types.type AS "Type of death / injury",
               COALESCE(SUM(reports.event_type = 'animal_carcass'), 0) AS "Carcasses",
               COALESCE(SUM(reports.event_type = 'sick_injured_animal'), 0) AS "Sick / injured animals"
        FROM (SELECT 'Poached' AS type, 1 AS ord UNION ALL SELECT 'Conflict' AS type, 2 AS ord UNION ALL SELECT 'Natural' AS type, 3 AS ord UNION ALL SELECT 'PAC/Management' AS type, 4 AS ord UNION ALL SELECT 'Unknown' AS type, 5 AS ord) AS types
        LEFT JOIN (
          SELECT event_type, death_type AS type
          FROM df WHERE event_type IN ('animal_carcass', 'sick_injured_animal')
        ) AS reports ON reports.type = types.type
        GROUP BY types.type, types.ord ORDER BY types.ord
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Animal Health by Cause Table
