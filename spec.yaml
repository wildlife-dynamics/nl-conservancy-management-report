    partial:
      x_axis: Species responsible
      figures:
      - metric: {display_name: Events, aggregator: sum, column: Events, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Event type
      time_breakdown: null
      barmode: stack
      palette: ['#b62879', '#8c1700', '#ed3ea2', '#ff803e', '#3e35a3']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Event type
        xaxis: {title: Species responsible}
        yaxis: {title: Conflict events}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.hwc_by_species.return }}
  - name: Persist HWC by Species and Event Type Chart
