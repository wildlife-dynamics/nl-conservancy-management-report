    - ${{ workflow.completeness_tbl_w.return }}
    - ${{ workflow.events_trend_w.return }}
    - ${{ workflow.patrol_trend_w.return }}
    groupers: ${{ workflow.groupers.return }}
    time_range: ${{ workflow.time_range.return }}
    # What makes the Files tab non-empty. Without this the outputs exist on
    # disk and the app says there are no downloadable results, because the tab
    # is a manifest, not a directory listing.
    files: ${{ workflow.files_merged.return }}
