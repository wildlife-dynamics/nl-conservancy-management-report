  - name: HWC by Species
    id: hwc_by_species
    task: apply_sql_query
    partial:
      query: |
        SELECT sp."Species responsible" AS "Species responsible",
               ty."Event type" AS "Event type",
               COALESCE(cnt.n, 0) AS "Events"
        FROM (
          SELECT species_h AS "Species responsible", COUNT(*) AS total
          FROM df WHERE is_conflict = 1
            AND event_type IN ('hwc_livestock_predation', 'crop_damage',
                               'infrastructure_damage', 'human_injury', 'human_death')
          GROUP BY 1
        ) sp
        CROSS JOIN (
                    SELECT 'Crop damage' AS "Event type"
          UNION ALL SELECT 'Human death'
          UNION ALL SELECT 'Human injury'
          UNION ALL SELECT 'Infrastructure damage'
          UNION ALL SELECT 'Livestock predation'
        ) ty
        LEFT JOIN (
          SELECT species_h AS sp_name,
                 CASE event_type
                   WHEN 'hwc_livestock_predation' THEN 'Livestock predation'
                   WHEN 'crop_damage'             THEN 'Crop damage'
                   WHEN 'infrastructure_damage'   THEN 'Infrastructure damage'
                   WHEN 'human_injury'            THEN 'Human injury'
                   WHEN 'human_death'             THEN 'Human death'
                 END AS et,
                 COUNT(*) AS n
          FROM df WHERE is_conflict = 1
            AND event_type IN ('hwc_livestock_predation', 'crop_damage',
                               'infrastructure_damage', 'human_injury', 'human_death')
          GROUP BY 1, 2
        ) cnt ON cnt.sp_name = sp."Species responsible" AND cnt.et = ty."Event type"
        ORDER BY sp.total DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # STACKED, and using the same five conflict-type colours as the HWC report,
  # so a reader moving between the two documents sees crop damage in the same
  # pink. Sorted order is Crop damage, Human death, Human injury,
  # Infrastructure damage, Livestock predation.
  - name: Draw HWC by Species and Event Type Bar Chart
    id: hwc_bar
    task: draw_chart
    partial:
      x_axis: Species responsible
      figures:
      - metric: {display_name: Events, aggregator: sum, column: Events, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Event type
      time_breakdown: null
      barmode: stack
      palette: ['#b62879', '#8c1700', '#ed3ea2', '#ff803e', '#3e35a3']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Event type
        xaxis: {title: Species responsible}
        yaxis: {title: Conflict events}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.hwc_by_species.return }}
  - name: Persist HWC by Species and Event Type Chart
    id: hwc_bar_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: hwc_bar_chart
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.hwc_bar.return }}
  - name: HWC by Species and Event Type Chart Widget
    id: hwc_bar_w
    task: create_plot_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: HWC by Species and Event Type
    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.hwc_bar_html.return }}
  - name: Merge HWC by Species and Event Type Chart Views
    id: hwc_bar_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.hwc_bar_w.return }}
  # EVERY QUALIFYING REPORT. Review 2: "The 24 incidents include one wildlife
  # death (the October elephant conflict carcass), but Wildlife death isn't on
  # the map legend. Please check that all 24 are plotted." They were not: this
  # map listed the five HWC forms by name and so left out conflict carcasses,
  # conflict injuries to wildlife and retaliatory poisoning, which the
  # incident count includes. It now takes exactly the rows the count does
  # (is_conflict = 1), less any without a usable location.
  - name: HWC Points
    id: hwc_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry, event_type_display AS "Event type", type_key,
               CASE WHEN event_type IN ('animal_carcass', 'sick_injured_animal')
                    THEN COALESCE(animal_h, 'Unknown') || ' (animal harmed)' ELSE species_h END AS "Species responsible",
               substr(report_time, 1, 16) AS "Date"
        FROM df WHERE is_conflict = 1 AND counted = 1
          AND geometry IS NOT NULL AND geometry <> 'POINT (0 0)'
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: HWC Incidents Map Colormap
    id: hwc_cmap
    task: apply_color_map
    partial:
      input_column_name: type_key
      colormap: *event_type_colors
      output_column_name: hwc_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.hwc_points.return }}
  - name: HWC Incidents Map Point Layer
    id: hwc_layer
    task: create_point_layer
    skipif:
      conditions: *id003
    partial:
      layer_style:
        get_radius: 7.0
        radius_units: pixels
        fill_color_column: hwc_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.85
      legend:
        label_column: Event type
        color_column: hwc_color
      tooltip_columns:
      - Event type
      - Species responsible
      - Date
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.hwc_cmap.return }}
  - name: HWC Incidents Map Layers
    id: hwc_map_layers
    task: combine_map_layers
    partial:
      static_layers: ${{ workflow.boundary_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.hwc_layer.return }}
