    id: mandate_tbl_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.mandate_tbl_w.return }}
  # SQL notes:
  # ONE NAME PER RANGER. Review: "Ranger names vary... 'Edung Mosienye' /
  # 'Edung Mosieny', 'Micka' / 'Mika Yiangere'". They are not typos in the
  # records: the patrol details take Team Leader and Team members from two
  # separate ER choice lists, and the same person is spelled differently
  # in each (leader list: Edung Mosienye, Micka Yiangere; member list:
  # Edung Mosieny, Mika Yiangere). Each choice is mapped to one name here;
  # the lasting fix is one shared list in ER. 'Other' on the leader list
  # means the leader was not on it, so it is shown as such, not as a
  # person.
  #
  # DISTINCT (patrol, ranger) before summing, so a leader also ticked as a
  # team member under the other spelling is credited once, not twice.
  # Each patrol's distance and (capped) time is credited in full to
  # every team member, so this table does not sum to the patrol totals --
  # the report says so under it.
  - name: Ranger Summary
    id: ranger_summary
    task: apply_sql_query
    partial:
      query: |
        SELECT ranger AS "Ranger", COUNT(*) AS "Patrols",
               printf('%,d.%d', CAST(ROUND(COALESCE(SUM(distance_km), 0) * 10) AS INTEGER) / 10, CAST(ROUND(COALESCE(SUM(distance_km), 0) * 10) AS INTEGER) % 10) AS "Distance (km)",
               printf('%,d.%d', CAST(ROUND(COALESCE(SUM(duration_h), 0) * 10) AS INTEGER) / 10, CAST(ROUND(COALESCE(SUM(duration_h), 0) * 10) AS INTEGER) % 10) AS "Time on patrol (h)"
        FROM (
          SELECT DISTINCT patrol_id,
                 CASE TRIM(raw)
                   WHEN 'Edung Mosieny' THEN 'Edung Mosienye'
                   WHEN 'edung' THEN 'Edung Mosienye'
                   WHEN 'edung_mosieny' THEN 'Edung Mosienye'
                   WHEN 'Micka Yiangere' THEN 'Mika Yiangere'
                   WHEN 'Micka' THEN 'Mika Yiangere'
                   WHEN 'micka' THEN 'Mika Yiangere'
                   WHEN 'mika_yiangere' THEN 'Mika Yiangere'
                   WHEN 'henet' THEN 'Henet Manyaas'
                   WHEN 'henet_manyaas' THEN 'Henet Manyaas'
                   WHEN 'Other' THEN 'Other (not on the list)'
                   WHEN 'other' THEN 'Other (not on the list)'
                   WHEN 'angelyne_mesia' THEN 'Angelyne Meisa'
                   WHEN 'daniel_naiptari' THEN 'Daniel Naiptari'
                   WHEN 'frangs_sapuro' THEN 'Frangs Sapuro'
                   WHEN 'jane_lesadela' THEN 'Jane Lesadela'
                   WHEN 'janet_mosieny' THEN 'Janet Sadela'
                   WHEN 'jeremiah_yangere' THEN 'Jeremiah Yangere'
                   WHEN 'jonathan_parkirewua' THEN 'Jonathan Parkirewua'
                   WHEN 'joseph_kinder' THEN 'Joseph Kinder'
                   WHEN 'joshua_mosiany' THEN 'Joshua Mosiany'
                   WHEN 'joyce_naiputari' THEN 'Joyce Naiputari'
                   WHEN 'kaniki_meshami' THEN 'Kaniki Meshami'
                   WHEN 'mary_sanguya' THEN 'Mary Sanguya'
                   WHEN 'naiputari_lumatenken' THEN 'Naiputari'
                   WHEN 'peter_kermui' THEN 'Peter Kermui'
                   WHEN 'robert_karkuli' THEN 'Robert Karkuli'
                   WHEN 'samuel_leshao' THEN 'Samuel Leshao'
                   WHEN 'samuel_leshay' THEN 'Samuel Leshao'
                   WHEN 'samuel_meshanu' THEN 'Samuel Meshami'
                   WHEN 'tony_lekerisat' THEN 'Tony Lekerisae'
                   WHEN 'samuel_meshami' THEN 'Samuel Meshami'
                   WHEN 'silamo_siangau' THEN 'Silamo Siangau'
                   WHEN 'simpiri_alex' THEN 'Simpiri Alex'
                   WHEN 'solomon_parkirewa' THEN 'Solomon Parkirewa'
                   WHEN 'thomson_mosiany' THEN 'Thomson Mosieny'
                   WHEN 'tony_lekerisae' THEN 'Tony Lekerisae'
                   WHEN 'wamae_karkuli' THEN 'Wamae Karkuli'
                   ELSE TRIM(raw)
                 END AS ranger,
                 distance_km, duration_h
          FROM (
            -- Team leader plus up to twelve team members per patrol, read by
            -- position rather than with json_each, which the task's SQLite
            -- sandbox may refuse to construct.
            SELECT patrol_id, team_leader AS raw, distance_km, duration_h FROM df WHERE team_leader NOT IN ('No patrol details', 'Not recorded')
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[0]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[1]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[2]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[3]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[4]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[5]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[6]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[7]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[8]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[9]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[10]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
            UNION ALL SELECT patrol_id, json_extract(team_members, '$[11]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
          ) AS roster
          WHERE raw IS NOT NULL AND TRIM(raw) <> ''
        ) AS credited
        GROUP BY ranger ORDER BY CASE WHEN ranger LIKE 'Other%' THEN 1 ELSE 0 END, SUM(distance_km) DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.patrols_grouped.return }}
  - name: Draw Effort by Ranger Table
    id: ranger_tbl
    task: draw_table
    partial:
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: false
        enable_download: true
        hide_header: false
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.ranger_summary.return }}
  - name: Persist Effort by Ranger Table
    id: ranger_tbl_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: ranger_table
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.ranger_tbl.return }}
  - name: Effort by Ranger Table Widget
    id: ranger_tbl_w
    task: create_table_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Effort by Ranger
    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.ranger_tbl_html.return }}
  - name: Merge Effort by Ranger Table Views
    id: ranger_tbl_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.ranger_tbl_w.return }}
- title: Patrol Coverage
  type: task-group
  description: Days since each 1 km cell was last patrolled, and the share of the conservancy patrolled (patrol-field-effort).
  tasks:
  # COVERAGE. Review 2: "add a '% of conservancy patrolled' stat card and a
  # 'Days since last patrol' grid map (1 km cells, clipped to the conservancy
  # boundary), using the patrol-field-effort workflow."
  #
  # This is patrol-field-effort's own task chain (github.com/wildlife-dynamics/
  # patrol-field-effort, spec.yaml, "Create Analysis Grid" to "Calculate
  # Patrol Coverage Fraction"), copied task for task with the same ids and
  # parameters. Only the inputs differ:
  #   - the study area is the Naibunga Lower boundary (Conservancy Boundary)
  #     instead of an ER spatial feature picked on the form;
  #   - the tracks are Tracks Inside the Period -- cut to the period, capped at
  #     14 h and through the trajectory filter -- instead of raw patrol
  #     trajectories, so an open patrol or a GPS jump cannot mark cells it
  #     never reached. Tracks Inside the Period is SQL output, whose
  #     timestamps come back as text, so the two Parse steps turn
  #     segment_start / segment_end back into datetimes first;
  #   - the map is drawn with draw_ecomap like every other map in the report
  #     (same base maps, boundary, north arrow, scale bar, fixed view), from
  #     the same rgba colours and legend that patrol-field-effort's map uses.
  # Package versions: see requirements (ext-mep 1.11.2 / ext-ste 0.0.36, not
  # the 1.0.3 / 0.0.0rc1 that workflow pins, which cannot load beside
  # ext-custom 0.1.5).
  # The dwell-time and route-density maps of that workflow are not part of
  # the review request and are left out.
  - name: Validate Study Area Geometry
    id: assert_polygon
    task: ecoscope_workflows_ext_mep.tasks.spatial_operations.assert_polygon_types
    partial:
      gdf: ${{ workflow.boundary.return }}
  - name: Prepare Study Area for Analysis
    id: reproject_spatial_3857
    task: reproject_gdf
    partial:
      gdf: ${{ workflow.assert_polygon.return }}
      target_crs: EPSG:3857
  - name: Create Analysis Grid
    id: create_geo_meshgrid
    task: create_meshgrid
    partial:
      aoi: ${{ workflow.reproject_spatial_3857.return }}
      crs: EPSG:3857
      intersecting_only: true
  - name: Clip Grid to Study Area
    id: overlay_meshgrid_spatial
    task: ecoscope_workflows_ext_mep.tasks.spatial_operations.overlay_gdf
    partial:
      left: ${{ workflow.create_geo_meshgrid.return }}
      right: ${{ workflow.reproject_spatial_3857.return }}
      how: intersection
      keep_geom_type: true
      make_valid: true
  - name: Reset Index on Meshgrid
    id: meshgrid_idx_id
    task: ecoscope_workflows_ext_mep.tasks.transformation.reset_dataframe_index
    partial:
      df: ${{ workflow.overlay_meshgrid_spatial.return }}
      drop: false
  - name: Parse Track Start Times
    id: cov_traj_start
    task: extract_column_as_type
    partial:
      df: ${{ workflow.traj_in.return }}
      column_name: segment_start
      output_type: datetime
      output_column_name: segment_start
      fan_out: true
  - name: Parse Track End Times
    id: cov_traj_times
    task: extract_column_as_type
    partial:
      df: ${{ workflow.cov_traj_start.return }}
      column_name: segment_end
      output_type: datetime
      output_column_name: segment_end
      fan_out: true
  - name: Prepare Patrol Trajectories for Analysis
    id: reproject_trajs
    task: reproject_gdf
    partial:
      gdf: ${{ workflow.cov_traj_times.return }}
      target_crs: EPSG:3857
  - name: Select Trajectory Columns
    id: select_patrol_columns
    task: select_columns
    partial:
      df: ${{ workflow.reproject_trajs.return }}
      columns: [segment_start, segment_end, geometry]
      raise_on_missing: true
  - name: Overlay Patrols on Grid
    id: spatial_join_patrol_trajs
    task: ecoscope_workflows_ext_ste.tasks.spatial_operations.spatial_join
    partial:
      left_df: ${{ workflow.select_patrol_columns.return }}
      right_df: ${{ workflow.meshgrid_idx_id.return }}
      how: inner
      predicate: intersects
  - name: Summarize Patrol Visits per Grid Cell
    id: summarize_df_grids
    task: summarize_df
    partial:
      df: ${{ workflow.spatial_join_patrol_trajs.return }}
      groupby_cols: [index]
      reset_index: true
      summary_params:
      - display_name: last_visited
        aggregator: max
        column: segment_end
        original_unit: null
        new_unit: null
        decimal_places: null
      - display_name: first_visited
        aggregator: min
        column: segment_start
        original_unit: null
        new_unit: null
        decimal_places: null
  - name: Calculate Days Since Last Visit
    id: add_time
    task: ecoscope_workflows_ext_mep.tasks.transformation.add_time_since_visit
    partial:
      df: ${{ workflow.summarize_df_grids.return }}
      time_range: ${{ workflow.time_range.return }}
  - name: Attach Visit Stats to Grid
    id: merge_gridded_stats
    task: merge_two_dataframes
    partial:
      left: ${{ workflow.meshgrid_idx_id.return }}
      right: ${{ workflow.add_time.return }}
      how: left
      'on': index
      left_on: null
      right_on: null
      left_index: false
      right_index: false
      fillna_value: null
  - name: Flag Visited Cells (Days Since Visit)
    id: add_null_flag
    task: ecoscope_workflows_ext_mep.tasks.transformation.add_non_null_flag
    partial:
      df: ${{ workflow.merge_gridded_stats.return }}
      source_column: days_since_visit
      flag_column: visited
  - name: Classify Days Since Visit into Bins
    id: add_custom_visit_bins
    task: ecoscope_workflows_ext_mep.tasks.transformation.add_visit_bins
    partial:
      df: ${{ workflow.add_null_flag.return }}
      col: days_since_visit
      mask_col: visited
      new_col: visit_bin
      bins: 5
      scheme: natural_breaks
      no_data_label: Unvisited
      use_abs: true
  - name: Color Days Since Visit Bins
    id: add_visit_bin_colors
    task: ecoscope_workflows_ext_mep.tasks.transformation.add_bin_colors
    partial:
      df: ${{ workflow.add_custom_visit_bins.return }}
      col: visit_bin
      new_col: hex_color
      cmap:
        type_: palette
        name: RdYlGn
      no_data_color: '#808080'
      no_data_label: Unvisited
  - name: Prepare Visit Layer for Mapping
    id: reproject_4326
    task: reproject_gdf
    partial:
      gdf: ${{ workflow.add_visit_bin_colors.return }}
      target_crs: EPSG:4326
  - name: Decategorize Hex Colors (Days Since Visit)
    id: decat_time_visit_hex
    task: convert_column_values_to_string
    partial:
      df: ${{ workflow.reproject_4326.return }}
      columns: [hex_color]
  - name: Prepare Colors for Days Since Visit Map
    id: add_time_visit_rgba
    task: ecoscope_workflows_ext_ste.tasks.transformation.add_rgba_from_hex
    partial:
      df: ${{ workflow.decat_time_visit_hex.return }}
      column: hex_color
      new_column: rgba_color
  - name: Sort Days Since Visit Legend
    id: order_bin_visit_since
    task: ecoscope_workflows_ext_mep.tasks.transformation.order_bin_categories
    partial:
      df: ${{ workflow.add_time_visit_rgba.return }}
      bin_column: visit_bin
  # The map layer carries only what it draws; the first/last visit
  # timestamps stay in the grid above.
  - name: Days Since Visit Map Columns
    id: cov_map_cols
    task: select_columns
    partial:
      df: ${{ workflow.order_bin_visit_since.return }}
      columns: [geometry, visit_bin, rgba_color, days_since_visit]
      raise_on_missing: true
  - name: Build Days Since Visit Map Layer
    id: coverage_layer
    task: create_polygon_layer
    skipif:
      conditions: *id003
    partial:
      geodataframe: ${{ workflow.cov_map_cols.return }}
      layer_style:
        fill_color_column: rgba_color
        get_line_color: [0, 0, 0, 255]
        get_line_width: 0.25
        stroked: true
        opacity: 0.55
      legend:
        title: Time Since Visit (Days)
        label_column: visit_bin
        color_column: rgba_color
        sort: ascending
      tooltip_columns:
      - visit_bin
  - name: Render Days Since Visit Map
    id: coverage_map
    task: draw_ecomap
    partial:
      geo_layers:
      - ${{ workflow.coverage_layer.return }}
      - ${{ workflow.boundary_layer.return }}
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: *map_arrow
      legend_style: *map_legend
      max_zoom: 15
      view_state: *conservancy_view
  - name: Save Days Since Visit Map
    id: coverage_map_html
    task: persist_text
    partial:
      text: ${{ workflow.coverage_map.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: days_since_patrol_visit_map
  - name: Create Time Since Visit Map Widget
    id: coverage_map_w
    task: create_map_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Days Since Patrol Visit (whole period)
      data: ${{ workflow.coverage_map_html.return }}
  - name: Calculate Patrol Coverage Fraction
    id: patrol_effort_spatial
    task: ecoscope_workflows_ext_mep.tasks.transformation.compute_patrol_effort_fraction
    partial:
      gdf: ${{ workflow.add_visit_bin_colors.return }}
  - name: Format Patrol Coverage as Percentage
    id: patrol_effort_quantity
    task: to_quantity
    partial:
      value: ${{ workflow.patrol_effort_spatial.return }}
      unit: '%'
  - name: Create Patrol Coverage Widget
    id: coverage_sv
    task: create_single_value_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Patrol Coverage (% of conservancy, whole period)
      decimal_places: 1
      data: ${{ workflow.patrol_effort_quantity.return }}
  # The Word report needs the figure as a table cell, and no task turns a
  # number into text, so the report card reads the same visited flag
  # compute_patrol_effort_fraction counts ("fraction of grid with >= 1
  # visit", patrol-field-effort technical guide): visited cells / all cells.
  - name: Coverage Cards
    id: coverage_cards
    task: apply_sql_query
    partial:
      df: ${{ workflow.add_null_flag.return }}
      query: |
        SELECT printf('%.1f%%', 100.0 * SUM(CASE WHEN visited THEN 1 ELSE 0 END) / COUNT(*)) AS "Conservancy patrolled",
               printf('%d of %d', SUM(CASE WHEN visited THEN 1 ELSE 0 END), COUNT(*)) AS "1 km grid cells patrolled"
        FROM df
      columns: null
      sanitize: true
- title: Encounter Rates
  type: task-group
  description: Wildlife and illegal activity per km patrolled (patrol-encounter-rate-map).
  tasks:
  # ENCOUNTER RATES. Review 2: "add encounter rate maps (events per km
  # patrolled) for Wildlife Sightings (sum of number of animals) and Illegal
  # Activity, using patrol-encounter-rate-map. Count only events recorded on
  # patrol, and keep the minimum-effort greying."
  #
  # This is patrol-encounter-rate-map's "Encounter Rate Map" task group,
  # copied task for task from its v2.0.0 release (commit 42fb25a, the last
  # release on ext-custom 0.1.5; later releases need ecoscope-platform 2.30,
  # which ext-custom 0.1.5 cannot be installed with). Same tasks, same
  # parameters, same Map Options form, once per map. Only the inputs differ:
  #   - events: the report's own events, kept to those attached to a patrol
  #     in ER and with a usable location. They already carry the field to
  #     sum, so that workflow's steps that fetch it from the event details
  #     and merge it back (details_agg_subset, pe_groups_with_agg) are not
  #     needed;
  #   - tracks: Tracks Inside the Period -- capped at 14 h and through the
  #     trajectory filter -- so an open patrol or a GPS jump cannot add
  #     kilometres to a cell (review 2: "Before either: apply the 14 h cap
  #     and a trajectory speed filter ... so open patrols and GPS jumps don't
  #     create false hotspots or inflate effort");
  #   - no grouping: one map for the whole period, which is what that
  #     workflow produces with no grouper set (its groupbykey / mapvalues /
  #     merge_widget_views steps reduce to single calls);
  #   - the map adds the conservancy boundary and the report's fixed view,
  #     like every other map in the report.
  - name: Wildlife Sightings on Patrol
    id: wl_er_events
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      # Animals counted on visual sightings; spoor and dung count 0, as in
      # the priority species maps.
      query: |
        SELECT id, geometry,
               CASE WHEN json_extract(event_details, '$."Sighting type"') = 'Visual'
                    THEN COALESCE(CAST(json_extract(event_details, '$."Total Individuals"') AS REAL), 0) ELSE 0 END AS "Total Individuals"
        FROM df
        WHERE counted = 1 AND event_type = 'wildlife_sighting'
          AND COALESCE(json_array_length(patrols), 0) > 0
          AND geometry IS NOT NULL AND geometry <> 'POINT (0 0)'
      columns: null
      sanitize: true
  - name: Illegal Activity on Patrol
    id: ia_er_events
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT id, geometry
        FROM df
        WHERE counted = 1 AND event_type_display = 'Illegal Activity'
          AND COALESCE(json_array_length(patrols), 0) > 0
          AND geometry IS NOT NULL AND geometry <> 'POINT (0 0)'
      columns: null
      sanitize: true
- title: Wildlife Encounter Rate Map
  type: task-group
  description: >-
    These settings generate a grid-based heatmap showing encounter rate (events per unit of patrol effort in each cell).
  tasks:
  - name: Map Options
    id: wl_map_options
    task: ecoscope_workflows_ext_custom.tasks.config.set_encounter_rate_map_options
    partial:
      intersecting_only: true
  - name: Aggregate Column Value
    id: wl_agg_column
    task: ecoscope_workflows_ext_custom.tasks.config.get_agg_column_from_map_options
    partial:
      options: ${{ workflow.wl_map_options.return }}
  - name: Map Base Layers
    id: wl_base_map_defs
    task: ecoscope_workflows_ext_custom.tasks.config.get_base_maps_from_map_options
    partial:
      options: ${{ workflow.wl_map_options.return }}
  - name: null
    id: wl_encounter_meshgrid
    task: ecoscope_workflows_ext_custom.tasks.config.call_meshgrid_from_map_options
    skipif:
      conditions:
      - any_is_empty_df
      - any_dependency_skipped
      - all_geometry_are_none
    partial:
      aoi: ${{ workflow.traj_in.return }}
      options: ${{ workflow.wl_map_options.return }}
  - name: Calculate Encounter Rate per Cell
    id: wl_encounter_rate_grid
    task: ecoscope_workflows_ext_custom.tasks.spatial_ops.calculate_encounter_rate_grid
    skipif:
      conditions:
      - any_dependency_skipped
    partial:
      feature_layers:
      - ${{ workflow.wl_er_events.return }}
      - ${{ workflow.traj_in.return }}
      meshgrid: ${{ workflow.wl_encounter_meshgrid.return }}
      sum_column: ${{ workflow.wl_agg_column.return }}
  - name: Drop Inactive Grid Cells
    id: wl_drop_inactive_cells
    task: ecoscope_workflows_ext_custom.tasks.spatial_ops.drop_inactive_grid_cells
    partial:
      df: ${{ workflow.wl_encounter_rate_grid.return }}
      event_column: event_count
      patrol_effort_column: patrol_effort_km
  - name: Fill NaN Encounter Rate With Zero
    id: wl_fill_nan_rate
    task: fill_na
    partial:
      df: ${{ workflow.wl_drop_inactive_cells.return }}
      columns: [density]
      value: 0
  - name: Sort Encounter Rate Values
    id: wl_sort_rate_values
    task: sort_values
    partial:
      df: ${{ workflow.wl_fill_nan_rate.return }}
      column_name: density
      ascending: true
      na_position: last
  - name: Classify Encounter Rate Values
    id: wl_classify_rate
    task: apply_classification
    partial:
      df: ${{ workflow.wl_sort_rate_values.return }}
      input_column_name: density
      output_column_name: rate_bins
      classification_options:
        scheme: equal_interval
        k: 10
      label_options:
        label_ranges: true
        label_decimals: 2
  - name: Encounter Rate Colormap
    id: wl_rate_colormap
    task: apply_color_map
    partial:
      df: ${{ workflow.wl_classify_rate.return }}
      input_column_name: rate_bins
      colormap: RdYlGn_r
      output_column_name: rate_colormap
  - name: Mask Threshold
    id: wl_mask_threshold
    task: ecoscope_workflows_ext_custom.tasks.config.get_mask_threshold_from_map_options
    partial:
      options: ${{ workflow.wl_map_options.return }}
  - name: Mask Low-Effort Cells Grey
    id: wl_mask_low_effort
    task: ecoscope_workflows_ext_custom.tasks.spatial_ops.mask_low_effort_cells
    partial:
      df: ${{ workflow.wl_rate_colormap.return }}
      patrol_effort_column: patrol_effort_km
      color_column: rate_colormap
      label_column: rate_bins
      threshold_km: ${{ workflow.wl_mask_threshold.return }}
      grey_color: [128, 128, 128, 255]
      grey_label: < 200 m patrol effort
  - name: Rate Numerator Label
    id: wl_rate_numerator_label
    task: default_if_string_is_empty
    partial:
      value: ${{ workflow.wl_agg_column.return }}
      default: Events
  - name: Rate Column Label
    id: wl_rate_col_label
    task: concat_string_vars
    partial:
      values:
      - ${{ workflow.wl_rate_numerator_label.return }}
      - ' per km'
  - id: wl_rename_rate_col
    task: map_columns
    partial:
      df: ${{ workflow.wl_mask_low_effort.return }}
      drop_columns: []
      retain_columns: []
      rename_columns:
        density: ${{ workflow.wl_rate_col_label.return }}
        event_count: Events
        event_sum: ${{ workflow.wl_rate_numerator_label.return }}
        patrol_effort_km: Patrol Effort (km)
      duplicate_strategy: suffix
      raise_if_not_found: false
  - name: Format Rate Tooltip
    id: wl_format_rate_tooltip
    task: map_values_with_unit
    partial:
      df: ${{ workflow.wl_rename_rate_col.return }}
      input_column_name: ${{ workflow.wl_rate_col_label.return }}
      output_column_name: ${{ workflow.wl_rate_col_label.return }}
      original_unit: null
      new_unit: null
      decimal_places: 2
  - name: Format Effort Tooltip
    id: wl_format_effort_tooltip
    task: map_values_with_unit
    partial:
      df: ${{ workflow.wl_format_rate_tooltip.return }}
      input_column_name: Patrol Effort (km)
      output_column_name: Patrol Effort (km)
      original_unit: null
      new_unit: null
      decimal_places: 2
  - name: Create Encounter Rate Polygon Layer
    id: wl_rate_polygon_layer
    task: create_polygon_layer
    skipif:
      conditions:
      - any_is_empty_df
      - any_dependency_skipped
      - all_geometry_are_none
    partial:
      geodataframe: ${{ workflow.wl_format_effort_tooltip.return }}
      layer_style:
        fill_color_column: rate_colormap
        get_line_width: 0
        opacity: 0.4
      legend:
        label_column: rate_bins
        color_column: rate_colormap
      tooltip_columns:
      - ${{ workflow.wl_rate_col_label.return }}
      - ${{ workflow.wl_rate_numerator_label.return }}
      - Patrol Effort (km)
  - name: Draw Encounter Rate Ecomap
    id: wl_er_map
    task: draw_ecomap
    partial:
      geo_layers:
      - ${{ workflow.wl_rate_polygon_layer.return }}
      - ${{ workflow.boundary_layer.return }}
      title: null
      tile_layers: ${{ workflow.wl_base_map_defs.return }}
      north_arrow_style:
        placement: top-left
      legend_style:
        title: ${{ workflow.wl_rate_col_label.return }}
        format_title: false
        placement: bottom-right
      static: false
      max_zoom: 20
      view_state: *conservancy_view
      widget_id: Wildlife Encounter Rate Map (whole period)
  - name: Persist Encounter Rate Ecomap
    id: wl_er_map_html
    task: persist_text
    partial:
      text: ${{ workflow.wl_er_map.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: wildlife_encounter_rate_map
  - name: Create Encounter Rate Map Widget
    id: wl_er_map_w
    task: create_map_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Wildlife Encounter Rate Map (whole period)
      data: ${{ workflow.wl_er_map_html.return }}
