      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style:
        placement: top-left
      legend_style:
        placement: bottom-right
      # Review feedback on the HWC report, applied here too: at 20 the
      # auto-fitted view state zooms past the level the ArcGIS basemaps
      # serve tiles for over rural Laikipia, and a map with one or two
      # points fits to exactly that and renders grey. 15 is inside tile
      # coverage everywhere and still shows individual bomas.
      max_zoom: 15
    mapvalues:
