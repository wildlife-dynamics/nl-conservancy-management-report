- title: Data Completeness
  type: task-group
  description: Data-quality checks on patrols and events.
  tasks:
  - name: Patrol Data Checks
    id: patrol_checks
    task: apply_sql_query
    partial:
      query: |
        SELECT 1 AS ord, 'Patrols without Patrol Info' AS "Check", SUM(has_patrol_info = 0) AS "Count", COUNT(*) AS total FROM df
        UNION ALL SELECT 2, 'Patrols with no or short track (< 0.5 km)', SUM(distance_km < 0.5), COUNT(*) FROM df
        UNION ALL SELECT 3, 'Patrol duration over 14h', SUM(duration_h > 14), COUNT(*) FROM df
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.patrols_grouped.return }}
  - name: Event Data Checks
    id: event_checks
    task: apply_sql_query
    partial:
      query: |
        SELECT 4 AS ord, 'Events with no location' AS "Check", SUM(geometry IS NULL) AS "Count", COUNT(*) AS total FROM df WHERE counted = 1
        UNION ALL SELECT 5, 'Events recorded off-patrol', SUM(COALESCE(json_array_length(patrols), 0) = 0), COUNT(*) FROM df WHERE counted = 1
        UNION ALL SELECT 6, '"Other" chosen with no notes',
          SUM(event_details LIKE '%"Other"%' AND COALESCE(json_extract(event_details, '$."Notes"'), '') = ''), COUNT(*) FROM df WHERE counted = 1
        UNION ALL SELECT 7, 'Sightings with 0 individuals',
          SUM(event_type = 'wildlife_sighting' AND COALESCE(CAST(json_extract(event_details, '$."Total Individuals"') AS REAL), 0) = 0), SUM(event_type = 'wildlife_sighting') FROM df WHERE counted = 1
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Pair Data Checks
    id: checks_zipped
    task: groupbykey
    skipif:
      conditions:
      - any_dependency_skipped
      - all_keyed_iterables_are_skips
      unpack_depth: 1
    partial:
      iterables:
      - ${{ workflow.patrol_checks.return }}
      - ${{ workflow.event_checks.return }}
  - name: Combine Data Checks
    id: checks_combined
    task: concat_dataframes
    partial:
      ensure_columns: []
      reset_index: true
    mapvalues:
      argnames: dfs
      argvalues: ${{ workflow.checks_zipped.return }}
  - name: Data Completeness
    id: completeness
    task: apply_sql_query
    partial:
      query: |
        SELECT "Check",
               CAST(COALESCE("Count", 0) AS INTEGER) AS "Count",
               ROUND(100.0 * COALESCE("Count", 0) / NULLIF(total, 0), 1) AS "% of total",
               CASE WHEN COALESCE("Count", 0) = 0 THEN 'OK' ELSE 'Review' END AS "Status"
        FROM df ORDER BY ord
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.checks_combined.return }}
  - name: Draw Data Completeness Table
    id: completeness_tbl
    task: draw_table
    partial:
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: false
        enable_download: true
        hide_header: false
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.completeness.return }}
  - name: Persist Data Completeness Table
    id: completeness_tbl_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: completeness_table
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.completeness_tbl.return }}
  - name: Data Completeness Table Widget
    id: completeness_tbl_w
    task: create_table_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Data Completeness
    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.completeness_tbl_html.return }}
  - name: Merge Data Completeness Table Views
    id: completeness_tbl_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.completeness_tbl_w.return }}
- title: Month-on-Month
  type: task-group
  description: Trend charts across the whole time range.
  tasks:
  # EVERY MONTH IN THE PERIOD, INCLUDING THE EMPTY ONES.
  #
  # Review feedback on the HWC report: "Stacked bar time axis must include
  # every month in the period, including zero months." The same defect is here.
  # draw_time_series_bar_chart buckets whatever rows it is given, so a month
  # with no counted events simply had no bucket and vanished from the axis,
  # making a gap in reporting look like a gap in time.
  #
  # The frame is now built the other way round: every month CROSS JOINed with
  # every category, counts LEFT JOINed on, so an empty month keeps a
  # zero-height bar and its slot.
  #
  # The month list spans MIN to MAX of report_time over EVERY event fetched for
  # the period, counted or not, so a month holding only patrol logistics still
  # appears. It is a proxy for the configured range rather than the range
  # itself: apply_sql_query sees only the dataframe, and nothing carries
  # since/until into SQL.
  #
  # `s` is a counter, and the only way to get one: the validator requires the
  # query to start with SELECT, so WITH RECURSIVE is out, and df is the single
  # readable table. It yields one integer per row of df, so the axis can span
  # at most as many months as the period has events.
  - name: Events per Month
    id: events_trend_df
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT mon."Month" AS "Month",
               cat."Category" AS "Category",
               COALESCE(cnt.n, 0) AS "Events"
        FROM (
          SELECT substr('000' || CAST((b.lo + s.n) / 12 AS TEXT), -4, 4) || '-' ||
                 substr('0' || CAST(((b.lo + s.n) % 12) + 1 AS TEXT), -2, 2) AS "Month"
          FROM (
            SELECT MIN(CAST(substr(report_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(report_time, 6, 2) AS INTEGER) - 1) AS lo,
                   MAX(CAST(substr(report_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(report_time, 6, 2) AS INTEGER) - 1) AS hi
            FROM df WHERE report_time IS NOT NULL
          ) b
          JOIN (SELECT ROW_NUMBER() OVER () - 1 AS n FROM df LIMIT 1200) s
            ON b.lo + s.n <= b.hi
        ) mon
        CROSS JOIN (
          SELECT DISTINCT event_category AS "Category" FROM df WHERE counted = 1
        ) cat
        LEFT JOIN (
          SELECT strftime('%Y-%m', report_time) AS mth,
                 event_category AS cg, COUNT(*) AS n
          FROM df WHERE counted = 1 GROUP BY 1, 2
        ) cnt ON cnt.mth = mon."Month" AND cnt.cg = cat."Category"
        ORDER BY 1, 2
      columns: null
      sanitize: true
  # draw_chart, not draw_time_series_bar_chart: "Month" is already a 'YYYY-MM'
  # string, so time_interval stays null and the x axis is categorical. Asking
  # draw_chart to bucket by month instead would re-derive the axis from the
  # data and drop the padded months again.
  - name: Draw Events per Month
    id: events_trend
    task: draw_chart
    partial:
      dataframe: ${{ workflow.events_trend_df.return }}
      x_axis: Month
      figures:
      - metric: {display_name: Events, aggregator: sum, column: Events, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Category
      time_breakdown: null
      barmode: stack
      palette: viridis
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Event category
        xaxis: {title: Month}
        yaxis: {title: Events recorded}
  - name: Persist Events per Month
    id: events_trend_html
    task: persist_text
    partial:
      text: ${{ workflow.events_trend.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: events_trend
  - name: Events per Month Widget
    id: events_trend_w
    task: create_plot_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Events per Month by Category
      data: ${{ workflow.events_trend_html.return }}
  # Same month scaffold as the events chart above, for the same reason: a month
  # in which no patrol went out has to hold its slot on the axis rather than
  # disappear. Distance is SUMmed rather than counted, so the padded rows carry
  # a zero distance and contribute nothing to the total.
  - name: Patrol Distance per Month
    id: patrol_trend_df
    task: apply_sql_query
    partial:
      df: ${{ workflow.patrols_indexed.return }}
      query: |
        SELECT mon."Month" AS "Month",
               ty."Patrol type" AS "Patrol type",
               COALESCE(d.km, 0) AS "Distance"
        FROM (
          SELECT substr('000' || CAST((b.lo + s.n) / 12 AS TEXT), -4, 4) || '-' ||
                 substr('0' || CAST(((b.lo + s.n) % 12) + 1 AS TEXT), -2, 2) AS "Month"
          FROM (
            SELECT MIN(CAST(substr(start_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(start_time, 6, 2) AS INTEGER) - 1) AS lo,
                   MAX(CAST(substr(start_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(start_time, 6, 2) AS INTEGER) - 1) AS hi
            FROM df WHERE start_time IS NOT NULL
          ) b
          JOIN (SELECT ROW_NUMBER() OVER () - 1 AS n FROM df LIMIT 1200) s
            ON b.lo + s.n <= b.hi
        ) mon
        CROSS JOIN (SELECT DISTINCT patrol_type AS "Patrol type" FROM df) ty
        LEFT JOIN (
          SELECT strftime('%Y-%m', start_time) AS mth, patrol_type AS pt,
                 ROUND(SUM(COALESCE(distance_km, 0)), 2) AS km
          FROM df GROUP BY 1, 2
        ) d ON d.mth = mon."Month" AND d.pt = ty."Patrol type"
        ORDER BY 1, 2
      columns: null
      sanitize: true
  - name: Draw Patrol Distance per Month
    id: patrol_trend
    task: draw_chart
    partial:
      dataframe: ${{ workflow.patrol_trend_df.return }}
      x_axis: Month
      figures:
      - metric: {display_name: Distance, aggregator: sum, column: Distance, decimal_places: 1}
        chart_type: bar
      time_interval: null
      category: Patrol type
      time_breakdown: null
      barmode: stack
      palette: viridis
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Patrol type
        xaxis: {title: Month}
        yaxis: {title: Distance travelled (km)}
  - name: Persist Patrol Distance per Month
    id: patrol_trend_html
    task: persist_text
    partial:
      text: ${{ workflow.patrol_trend.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: patrol_trend
  - name: Patrol Distance per Month Widget
    id: patrol_trend_w
    task: create_plot_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Patrol Distance per Month (km)
      data: ${{ workflow.patrol_trend_html.return }}
- title: Whole Period
  type: task-group
  description: Totals for the whole reporting period, beside the month-by-month tables.
  tasks:
  - name: Whole-Period Patrol Effort
    id: period_patrol_kpis
    task: apply_sql_query
    partial:
      df: ${{ workflow.patrols_indexed.return }}
      query: |
        SELECT COUNT(DISTINCT patrol_id) AS "Total patrols",
               ROUND(COALESCE(SUM(duration_h), 0), 1) AS "Time on patrol (hours)",
               ROUND(COALESCE(SUM(distance_km), 0), 1) AS "Distance travelled (km)",
               ROUND(SUM(distance_km) / NULLIF(SUM(duration_h), 0), 1) AS "Average speed (km/h)"
        FROM df
      columns: null
      sanitize: true
  - name: Whole-Period Events
    id: period_event_kpis
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT COALESCE(SUM(counted), 0) AS "Total events" FROM df
      columns: null
      sanitize: true
  - name: Whole-Period Animal Health
    id: period_ah_kpis
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT COALESCE(SUM(event_type = 'animal_carcass'), 0) AS "Carcasses found",
               COALESCE(SUM(event_type = 'sick_injured_animal'), 0) AS "Sick / injured animals"
        FROM df
      columns: null
      sanitize: true
  - name: Whole-Period MIKE
    id: period_mike_kpis
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT COUNT(*) AS "Elephant carcasses",
               COALESCE(SUM(death_type = 'Poached'), 0) AS "Illegally killed",
               ROUND(100.0 * SUM(death_type = 'Poached') / NULLIF(COUNT(*), 0), 1) AS "PIKE (%)"
        FROM df WHERE event_type = 'animal_carcass' AND animal_h = 'Elephant'
      columns: null
      sanitize: true
  - name: Whole-Period HWC
    id: period_hwc_kpis
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT COALESCE(SUM(is_conflict), 0) AS "HWC incidents",
               COALESCE(SUM(is_conflict = 1 AND event_type = 'human_injury'), 0) AS "People injured",
               COALESCE(SUM(is_conflict = 1 AND event_type = 'human_death'), 0) AS "People killed",
               CAST(COALESCE(SUM(CASE WHEN event_type = 'hwc_livestock_predation'
                    THEN COALESCE(CAST(json_extract(event_details, '$."Total livestock injured"') AS REAL), 0) END), 0) AS INTEGER) AS "Livestock injured",
               CAST(COALESCE(SUM(CASE WHEN event_type = 'hwc_livestock_predation'
                    THEN COALESCE(CAST(json_extract(event_details, '$."Total livestock dead"') AS REAL), 0) END), 0) AS INTEGER) AS "Livestock killed",
               COALESCE(SUM(CASE WHEN is_conflict = 1 THEN ret_taken ELSE 0 END), 0) AS "Retaliation incidents"
        FROM df
      columns: null
      sanitize: true
  - name: Whole-Period Human Injury and Death
    id: period_hid_kpis
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT COALESCE(SUM(event_type = 'human_injury'), 0) AS "People injured",
               COALESCE(SUM(event_type = 'human_death'), 0) AS "People killed"
        FROM df
      columns: null
      sanitize: true
