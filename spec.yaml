      static_layers: ${{ workflow.boundary_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.patrol_layer.return }}
  - name: Draw Patrol Trajectories Map
    id: patrol_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: &map_arrow
        placement: top-left
      # Legend top-right: in this window the bottom-right corner is where the
      # 4 January thefts fall (~37.14 E, 0.46 N), and the top-right (north of
      # the conservancy, east of 37.1 E) is where almost nothing is recorded.
      # Top-left holds the north arrow and bottom-left the scale bar.
      legend_style: &map_legend
        placement: top-right
        title: Legend
      # A FIXED VIEW: the whole conservancy plus the ground around it, at
      # zoom 10 (deck.gl, 512-px tiles: ~76 m per pixel).
      #   - The report screenshots are 1280 x 720: the view is ~98 x 55 km
      #     and the boundary fills ~22% of the width.
      #   - The dashboard map widgets are smaller (roughly 800 x 400). Zoom
      #     11.2 framed the conservancy in the report but cut its top and
      #     bottom off on the dashboard (fourth live run). At zoom 10 it is
      #     whole in both, ~35% of a dashboard map's width.
      #   - It also holds every mapped event of Jan-Nov 2026 except points at
      #     0,0 / outside East Africa, which are left off the maps anyway.
      #   - Earlier settings, for the record: 12.6 and 11.6 cut the
      #     conservancy; 11.2 cut it on the dashboard; zoom 9 was considered
      #     and rejected (conservancy ~11% of the width).
      #   - draw_ecomap's own fit uses whole-number zooms and assumes a
      #     smaller viewport, and a per-month fractional fit would need two
      #     keyed inputs zipped into one draw_ecomap call, which the
      #     compiler's map/mapvalues cannot do -- hence one fixed view.
      # Points at 0,0 or outside East Africa are left off every map before
      # this (and counted in Data Completeness). Every map below reuses it.
      max_zoom: 15
      view_state: &conservancy_view
        longitude: 36.98
        latitude: 0.53
        zoom: 10.0
        pitch: 0
        bearing: 0
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.patrol_map_layers.return }}
