- title: Event Summary
  type: task-group
  description: Event totals and types (Logistics and Household Survey excluded).
  tasks:
  - name: Event Totals
    id: event_kpis
    task: apply_sql_query
    partial:
      query: |
        SELECT COALESCE(SUM(counted), 0) AS "Total events" FROM df
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Total Events Value
    id: event_kpi_0_val
    task: dataframe_column_sum
    partial:
      column_name: Total events
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.event_kpis.return }}
  - name: Total Events Widget
    id: event_kpi_0_sv
    task: create_single_value_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Total Events
      decimal_places: 0
    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.event_kpi_0_val.return }}
  - name: Merge Total Events Views
    id: event_kpi_0_svw
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.event_kpi_0_sv.return }}
  - name: Events by Type
    id: event_type_counts
    task: apply_sql_query
    partial:
      query: |
        SELECT event_type_display AS "Event type", MAX(type_key) AS type_key, COUNT(*) AS "Events"
        FROM df WHERE counted = 1 GROUP BY 1 ORDER BY 3 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # ONE COLOUR PER EVENT TYPE, EVERYWHERE. Review: "Establish consistent colour
  # mappings for event types, patrol types and species wherever the same
  # categories appear across figures." A list palette is dealt out in whatever
  # order the categories turn up, so Theft could be blue in January and green in
  # February. A dict is keyed by the type itself. The five HWC types keep the
  # HWC report's colours, so the two documents agree. Types not listed fall
  # under 'Other' (type_key), grey.
  - name: Event Type Colours
    id: event_type_cmap
    task: apply_color_map
    partial:
      input_column_name: type_key
      colormap: &event_type_colors
        HWC Livestock Predation: '#3e35a3'
        Crop Damage: '#b62879'
        Infrastructure Damage: '#ff803e'
        Human Injury: '#ed3ea2'
        Human Death: '#8c1700'
        Wildlife Sighting: '#004e26'
        Animal Carcass: '#002960'
        Sick / Injured Animal: '#3089ff'
        HWC Threat: '#f4a261'
        HWC Mitigation Response: '#e9c46a'
        HWC Retaliation: '#9d0208'
        Illegal Activity: '#f23b0e'
        Theft: '#2a9d8f'
        Snares & Traps: '#bc6c25'
        Poacher Camp: '#577590'
        Poacher Spoor (Human & Vehicle): '#6d597a'
        Gunshot: '#343a40'
        Arrest: '#0081a7'
        Contact (human-human): '#d81159'
        Poisoning: '#a100cb'
        Recovered trophy: '#8338ec'
        Rainfall Report: '#6a994e'
        Other: '#8a8f98'
      output_column_name: type_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.event_type_counts.return }}
  # A HORIZONTAL BAR, not a pie. Review 2: "Fig. 3: Change the pie for a
  # horizontal bar chart, as agreed previously. The labels pile up, and the
  # legend is clipped with a scrollbar ('Crop Damage' is cut off)." ext-wd's
  # draw_events_by_type_chart: one bar per event type, largest on top, every
  # type labelled on the axis (no legend to clip), each bar labelled
  # "count (share%)", whole-number ticks. It counts one row per event and
  # takes each bar's colour from type_color, a hex string here -- the same
  # event_type_colors map as everywhere else, written out as a CASE because
  # apply_color_map gives RGBA tuples, which plotly bars do not accept.
  - name: Event Type Rows
    id: event_type_rows
    task: apply_sql_query
    partial:
      query: |
        SELECT id, event_type_display,
               CASE type_key WHEN 'HWC Livestock Predation' THEN '#3e35a3' WHEN 'Crop Damage' THEN '#b62879' WHEN 'Infrastructure Damage' THEN '#ff803e' WHEN 'Human Injury' THEN '#ed3ea2' WHEN 'Human Death' THEN '#8c1700' WHEN 'Wildlife Sighting' THEN '#004e26' WHEN 'Animal Carcass' THEN '#002960' WHEN 'Sick / Injured Animal' THEN '#3089ff' WHEN 'HWC Threat' THEN '#f4a261' WHEN 'HWC Mitigation Response' THEN '#e9c46a' WHEN 'HWC Retaliation' THEN '#9d0208' WHEN 'Illegal Activity' THEN '#f23b0e' WHEN 'Theft' THEN '#2a9d8f' WHEN 'Snares & Traps' THEN '#bc6c25' WHEN 'Poacher Camp' THEN '#577590' WHEN 'Poacher Spoor (Human & Vehicle)' THEN '#6d597a' WHEN 'Gunshot' THEN '#343a40' WHEN 'Arrest' THEN '#0081a7' WHEN 'Contact (human-human)' THEN '#d81159' WHEN 'Poisoning' THEN '#a100cb' WHEN 'Recovered trophy' THEN '#8338ec' WHEN 'Rainfall Report' THEN '#6a994e' ELSE '#8a8f98' END AS type_color
        FROM df WHERE counted = 1
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Event Types Bar
    id: event_type_pie
    task: draw_events_by_type_chart
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.event_type_rows.return }}
  - name: Persist Event Types Chart
    id: event_type_pie_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: event_type_pie_chart
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.event_type_pie.return }}
  - name: Event Types Chart Widget
    id: event_type_pie_w
    task: create_plot_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Event Types
    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.event_type_pie_html.return }}
  - name: Merge Event Types Chart Views
    id: event_type_pie_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.event_type_pie_w.return }}
- title: Wildlife Monitoring
  type: task-group
  description: Sightings by species, with a proportional-symbol map.
  tasks:
  # SQL notes:
  # Review: "Confirm that the 81 flagged records relate only to visual
  # sightings." They did not: 52 of them had no sighting type at all, and
  # this table used to count those as visual. A blank type is now its own
  # column, and individuals are summed for visual sightings only -- spoor
  # and dung say a species was present, not how many.
  #
  # Legacy Ranger Basic sightings that were never migrated are included
  # (as 'Not recorded'), so the table's rows add up to the Wildlife
  # Sighting slice in Section 2. Almost all of them are empty forms.
  - name: Wildlife Summary
    id: wildlife_summary
    task: apply_sql_query
    partial:
      query: |
        SELECT COALESCE(animal_h, 'Not recorded') AS "Species",
               SUM(CASE WHEN json_extract(event_details, '$."Sighting type"') = 'Visual' THEN 1 ELSE 0 END) AS "Visual sightings",
               printf('%,d', CAST(SUM(CASE WHEN json_extract(event_details, '$."Sighting type"') = 'Visual'
                             THEN COALESCE(CAST(json_extract(event_details, '$."Total Individuals"') AS REAL), 0) ELSE 0 END) AS INTEGER)) AS "Individuals counted",
               SUM(CASE WHEN json_extract(event_details, '$."Sighting type"') IN ('Spoor', 'Dung/Pellets') THEN 1 ELSE 0 END) AS "Signs (spoor or dung)",
               SUM(CASE WHEN COALESCE(json_extract(event_details, '$."Sighting type"'), '') = '' THEN 1 ELSE 0 END) AS "Type not recorded",
               COUNT(*) AS "All sightings"
        FROM df WHERE counted = 1 AND event_type IN ('wildlife_sighting', 'wildlife_sighting_rep_ranger')
        GROUP BY 1 ORDER BY CASE WHEN COALESCE(animal_h, 'Not recorded') = 'Not recorded' THEN 1 ELSE 0 END, 6 DESC, 1
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Wildlife Sightings by Species Table
    id: wildlife_tbl
    task: draw_table
    partial:
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: false
        enable_download: true
        hide_header: false
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.wildlife_summary.return }}
  - name: Persist Wildlife Sightings by Species Table
    id: wildlife_tbl_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: wildlife_table
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.wildlife_tbl.return }}
  - name: Wildlife Sightings by Species Table Widget
    id: wildlife_tbl_w
    task: create_table_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Wildlife Sightings by Species
    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.wildlife_tbl_html.return }}
  - name: Merge Wildlife Sightings by Species Table Views
    id: wildlife_tbl_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.wildlife_tbl_w.return }}
  # SQL notes:
  # A POINT MAP. Review 2: "Fig. 4: can we change this to a point map? I think
  # the proportional symbols make it cluttered and it has no size legend."
  # Every sighting is now one dot of the same size, coloured by species; the
  # animals counted are in the tooltip, and the priority species maps carry
  # the sized symbols. "Species group" folds the long tail into 'Other species' so the
  # legend stays readable and each named species keeps one colour in
  # every map (the species_colors map). color_key is "Species group" without
  # apostrophes: wt-compiler 0.8.3 writes colormap keys into the generated
  # Python inside single quotes without escaping them, so a key like
  # "Grevy's Zebra" breaks the build. Names shown on maps keep the apostrophe.
  - name: Wildlife Points
    id: wildlife_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry,
               COALESCE(animal_h, 'Not recorded') AS "Species",
               CASE WHEN animal_h IN ('Elephant', 'Lion', 'Leopard', 'Wild Dog', 'Cheetah', 'Reticulated Giraffe',
                      'Grevy''s Zebra', 'Burchell''s Zebra', 'Impala', 'Spotted Hyena', 'Striped Hyena', 'Gerenuk',
                      'Eland', 'Buffalo') THEN animal_h ELSE 'Other species' END AS "Species group",
               REPLACE(CASE WHEN animal_h IN ('Elephant', 'Lion', 'Leopard', 'Wild Dog', 'Cheetah', 'Reticulated Giraffe',
                      'Grevy''s Zebra', 'Burchell''s Zebra', 'Impala', 'Spotted Hyena', 'Striped Hyena', 'Gerenuk',
                      'Eland', 'Buffalo') THEN animal_h ELSE 'Other species' END, '''', '') AS color_key,
               CAST(COALESCE(CAST(json_extract(event_details, '$."Total Individuals"') AS REAL), 0) AS INTEGER) AS "Individuals",
               COALESCE(json_extract(event_details, '$."Sighting type"'), 'Not recorded') AS "Sighting type",
               substr(report_time, 1, 16) AS "Date",
               3 + 3 * sqrt(MAX(COALESCE(CAST(json_extract(event_details, '$."Total Individuals"') AS REAL), 0), 1)) AS radius
        FROM df WHERE event_type = 'wildlife_sighting' AND counted = 1
          AND geometry IS NOT NULL AND geometry <> 'POINT (0 0)'
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Wildlife Sightings Map Colormap
    id: wildlife_cmap
    task: apply_color_map
    partial:
      input_column_name: color_key
      colormap: &species_colors
        Elephant: '#3e35a3'
        Lion: '#f23b0e'
        Leopard: '#ff803e'
        Wild Dog: '#b62879'
        Cheetah: '#e9c46a'
        Reticulated Giraffe: '#a100cb'
        Grevys Zebra: '#002960'
        Burchells Zebra: '#3089ff'
        Impala: '#2a9d8f'
        Spotted Hyena: '#8c1700'
        Striped Hyena: '#bc6c25'
        Gerenuk: '#6a994e'
        Eland: '#577590'
        Buffalo: '#343a40'
        Other species: '#8a8f98'
      output_column_name: wildlife_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.wildlife_points.return }}
  - name: Wildlife Sightings Map Point Layer
    id: wildlife_layer
    task: create_point_layer
    skipif:
      conditions: *id003
    partial:
      layer_style:
        get_radius: 6.0
        radius_units: pixels
        fill_color_column: wildlife_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.85
      legend:
        label_column: Species group
        color_column: wildlife_color
      tooltip_columns:
      - Species
      - Individuals
      - Sighting type
      - Date
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.wildlife_cmap.return }}
  - name: Wildlife Sightings Map Layers
    id: wildlife_map_layers
    task: combine_map_layers
    partial:
      static_layers: ${{ workflow.boundary_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.wildlife_layer.return }}
  - name: Draw Wildlife Sightings Map Map
    id: wildlife_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: *map_arrow
      legend_style: *map_legend
      # Extent = the conservancy boundary; see Draw Patrol Trajectories Map.
      max_zoom: 15
      view_state: *conservancy_view
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.wildlife_map_layers.return }}
  - name: Persist Wildlife Sightings Map Map
    id: wildlife_map_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: wildlife_map
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.wildlife_map.return }}
  - name: Wildlife Sightings Map Map Widget
    id: wildlife_map_w
    task: create_map_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Wildlife Sightings Map
    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.wildlife_map_html.return }}
  - name: Merge Wildlife Sightings Map Map Views
    id: wildlife_map_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.wildlife_map_w.return }}
  # PRIORITY SPECIES: ONE MAP PER SPECIES, SIZED BY ANIMALS COUNTED.
  #
  # Review 1: "Implement maps with symbol sizes representing the number of
  # individuals observed. Ideally, allow users to select up to five species
  # during report configuration." Review 2: "Fig. 5 (priority species): Can
  # we change to a map per species please? Add a size legend."
  #
  # The species come from the Priority Species form field (up to five;
  # default Elephant, Lion, Wild Dog, Leopard). There are five fixed map
  # slots: slot n shows the n-th species chosen, and a slot with no species
  # (fewer than five chosen) filters to nothing, so its map is skipped and the
  # Word report leaves it out. Visual sightings with a count only.
  #
  # SIZE LEGEND: draw_ecomap's legend draws colour swatches, not sizes, so the
  # sizes are four fixed bands a text legend can name exactly -- 1, 2 to 5, 6
  # to 20, more than 20 animals -- at 5, 8, 12 and 17 px. The legend is a
  # second, titled box carried by an invisible layer (Priority Species Size
  # Key: one point at zero opacity), the same device as the HWC report's
  # predation map.
  - name: Priority Species Points
    id: priority_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry,
               animal_h AS "Species",
               CASE WHEN animal_h IN ('Elephant', 'Lion', 'Leopard', 'Wild Dog', 'Cheetah', 'Reticulated Giraffe',
                      'Grevy''s Zebra', 'Burchell''s Zebra', 'Impala', 'Spotted Hyena', 'Striped Hyena', 'Gerenuk',
                      'Eland', 'Buffalo') THEN animal_h ELSE 'Other species' END AS "Species group",
               REPLACE(CASE WHEN animal_h IN ('Elephant', 'Lion', 'Leopard', 'Wild Dog', 'Cheetah', 'Reticulated Giraffe',
                      'Grevy''s Zebra', 'Burchell''s Zebra', 'Impala', 'Spotted Hyena', 'Striped Hyena', 'Gerenuk',
                      'Eland', 'Buffalo') THEN animal_h ELSE 'Other species' END, '''', '') AS color_key,
               CAST(CAST(json_extract(event_details, '$."Total Individuals"') AS REAL) AS INTEGER) AS "Individuals",
               substr(report_time, 1, 16) AS "Date",
               CASE WHEN CAST(json_extract(event_details, '$."Total Individuals"') AS REAL) > 20 THEN 17
                    WHEN CAST(json_extract(event_details, '$."Total Individuals"') AS REAL) > 5 THEN 12
                    WHEN CAST(json_extract(event_details, '$."Total Individuals"') AS REAL) > 1 THEN 8
                    ELSE 5 END AS size_px
        FROM df WHERE event_type = 'wildlife_sighting' AND counted = 1
          AND json_extract(event_details, '$."Sighting type"') = 'Visual'
          AND COALESCE(CAST(json_extract(event_details, '$."Total Individuals"') AS REAL), 0) > 0
          AND geometry IS NOT NULL AND geometry <> 'POINT (0 0)'
        ORDER BY 4 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Priority Species Size Key Point
    id: priority_size_pt
    task: apply_sql_query
    skipif:
      conditions: *id002
    partial:
      df: ${{ workflow.events_safe.return }}
      query: |
        SELECT 'POINT (36.98 0.53)' AS geometry FROM (SELECT 1)
      columns: null
      sanitize: true
  - name: Priority Species Size Key
    id: priority_size_key
    task: create_point_layer
    partial:
      geodataframe: ${{ workflow.priority_size_pt.return }}
      layer_style:
        get_radius: 0.0
        radius_units: pixels
        get_fill_color: '#525252'
        stroked: false
        opacity: 0.0
        pickable: false
      legend:
        title: Animals counted (point size)
        labels: ['Smallest: 1', 'Small: 2 to 5', 'Medium: 6 to 20', 'Large: more than 20']
        colors: ['#525252', '#525252', '#525252', '#525252']
      tooltip_columns: []
  - name: Priority Species 1
    id: ps1_name
    task: get_collection_item
    partial:
      collection: ${{ workflow.priority_species.return }}
      key: 0
      default: (not selected)
      raise_on_missing: false
  - name: Priority Species 1 Title
    id: ps1_title
    task: concat_string_vars
    partial:
      values:
      - 'Priority species: '
      - ${{ workflow.ps1_name.return }}
  - name: Priority Species 1 Sightings
    id: ps1_pts
    task: filter_row_values
    partial:
      column: Species
      values:
      - ${{ workflow.ps1_name.return }}
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.priority_points.return }}
  - name: Priority Species 1 Colours
    id: ps1_cmap
    task: apply_color_map
    partial:
      input_column_name: color_key
      colormap: *species_colors
      output_column_name: species_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.ps1_pts.return }}
  - name: Priority Species 1 Layer
    id: ps1_layer
    task: create_point_layer
    skipif:
      conditions: *id003
    partial:
      layer_style:
        get_radius: size_px
        radius_units: pixels
        radius_scale: 1.0
        fill_color_column: species_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.8
      legend:
        title: Species
        label_column: Species
        color_column: species_color
      tooltip_columns:
      - Species
      - Individuals
      - Date
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.ps1_cmap.return }}
  - name: Priority Species 1 Map Layers
    id: ps1_map_layers
    task: combine_map_layers
    partial:
      static_layers:
      - ${{ workflow.boundary_layer.return }}
      - ${{ workflow.priority_size_key.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.ps1_layer.return }}
  - name: Draw Priority Species 1 Map
    id: ps1_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: *map_arrow
      legend_style: *map_legend
      max_zoom: 15
      view_state: *conservancy_view
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.ps1_map_layers.return }}
  - name: Persist Priority Species 1 Map
    id: ps1_map_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: priority_species_map_1
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.ps1_map.return }}
  - name: Priority Species 2
    id: ps2_name
    task: get_collection_item
    partial:
      collection: ${{ workflow.priority_species.return }}
      key: 1
      default: (not selected)
      raise_on_missing: false
  - name: Priority Species 2 Title
    id: ps2_title
    task: concat_string_vars
    partial:
      values:
      - 'Priority species: '
      - ${{ workflow.ps2_name.return }}
  - name: Priority Species 2 Sightings
    id: ps2_pts
    task: filter_row_values
    partial:
      column: Species
      values:
      - ${{ workflow.ps2_name.return }}
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.priority_points.return }}
  - name: Priority Species 2 Colours
    id: ps2_cmap
    task: apply_color_map
    partial:
      input_column_name: color_key
      colormap: *species_colors
      output_column_name: species_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.ps2_pts.return }}
  - name: Priority Species 2 Layer
    id: ps2_layer
    task: create_point_layer
    skipif:
      conditions: *id003
    partial:
      layer_style:
        get_radius: size_px
        radius_units: pixels
        radius_scale: 1.0
        fill_color_column: species_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.8
      legend:
        title: Species
        label_column: Species
        color_column: species_color
      tooltip_columns:
      - Species
      - Individuals
      - Date
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.ps2_cmap.return }}
  - name: Priority Species 2 Map Layers
    id: ps2_map_layers
    task: combine_map_layers
    partial:
      static_layers:
      - ${{ workflow.boundary_layer.return }}
      - ${{ workflow.priority_size_key.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.ps2_layer.return }}
  - name: Draw Priority Species 2 Map
    id: ps2_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: *map_arrow
      legend_style: *map_legend
      max_zoom: 15
      view_state: *conservancy_view
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.ps2_map_layers.return }}
  - name: Persist Priority Species 2 Map
    id: ps2_map_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: priority_species_map_2
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.ps2_map.return }}
  - name: Priority Species 3
    id: ps3_name
    task: get_collection_item
    partial:
      collection: ${{ workflow.priority_species.return }}
      key: 2
      default: (not selected)
      raise_on_missing: false
  - name: Priority Species 3 Title
    id: ps3_title
    task: concat_string_vars
    partial:
      values:
      - 'Priority species: '
      - ${{ workflow.ps3_name.return }}
  - name: Priority Species 3 Sightings
    id: ps3_pts
    task: filter_row_values
    partial:
      column: Species
      values:
      - ${{ workflow.ps3_name.return }}
