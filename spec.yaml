  # The cause label gets 1-5 invisible zero-width spaces, one count per type
  # of death: draw_incident_sunburst colours outer slices by LABEL, so a cause
  # seen under two types ("Cause not recorded" under Conflict and Unknown in
  # the fifth live run) took one colour for both and the ring stopped showing
  # which type each cause belongs to. The text shown is unchanged.
  # REVIEW 2: "I love this chart! ... can you make the inner ring (type of
  # death) match the Fig. 8 map colours, and then use varying shades of that
  # colour for the causes. Add counts to the slices." Each cause now takes a
  # shade of its type of death's Fig. 8 colour (darkest first, by cause name),
  # and both rings carry their count: inner "Conflict (3)", outer "Snare (2)".
  # The INNER ring's own colour is fixed by ext-wd 0.0.14's
  # draw_incident_sunburst (its incident-chip colour) and cannot be set from
  # here; the outer ring around it carries the Fig. 8 colour family, so each
  # type still reads in its map colour. Colouring the inner ring needs an
  # optional colour column added to that task upstream.
  # A SUNBURST. Review: "Replace the current stacked bar chart with a sunburst
  # chart to better illustrate the relationship between cause and type of
  # death." No ecoscope-platform task draws one; ext-wd 0.0.14's
  # draw_incident_sunburst does, generically: inner ring = `incident`, outer
  # ring = `event_type_display`, sized by rows, outer slices coloured by
  # `type_color`. Fed type of death as the inner ring and cause as the outer
  # one, it is exactly the chart asked for. Outer slices take their type of
  # death's colour (the death_type_colors map), so the colour says which ring
  # a cause belongs to. Its hover text says "events", which here are carcasses.
  - name: Elephant Sunburst Data
    id: mike_sun_df
    task: apply_sql_query
    partial:
      query: |
        SELECT id,
               dt AS incident_id,
               dt || ' (' || n_type || ')' AS incident,
               cause || ' (' || n_cause || ')'
                 || substr('​​​​​', 1, CASE dt
                      WHEN 'Conflict' THEN 1 WHEN 'Natural' THEN 2 WHEN 'PAC/Management' THEN 3
                      WHEN 'Poached' THEN 4 ELSE 5 END) AS event_type_display,
               CASE dt
                 WHEN 'Conflict' THEN CASE (rk - 1) % 4 WHEN 0 THEN '#b62879' WHEN 1 THEN '#cf5a9c' WHEN 2 THEN '#e28fbe' WHEN 3 THEN '#f2c4de' END
                 WHEN 'Natural' THEN CASE (rk - 1) % 4 WHEN 0 THEN '#ff803e' WHEN 1 THEN '#ffa070' WHEN 2 THEN '#ffc0a1' WHEN 3 THEN '#ffdfd0' END
                 WHEN 'PAC/Management' THEN CASE (rk - 1) % 4 WHEN 0 THEN '#ed3ea2' WHEN 1 THEN '#f26fb9' WHEN 2 THEN '#f7a0d0' WHEN 3 THEN '#fbd0e8' END
                 WHEN 'Poached' THEN CASE (rk - 1) % 4 WHEN 0 THEN '#3e35a3' WHEN 1 THEN '#6c64be' WHEN 2 THEN '#9d97d6' WHEN 3 THEN '#cecbeb' END
                 WHEN 'Unknown' THEN CASE (rk - 1) % 4 WHEN 0 THEN '#3089ff' WHEN 1 THEN '#64a6ff' WHEN 2 THEN '#98c4ff' WHEN 3 THEN '#cbe1ff' END
               END AS type_color
        FROM (
          SELECT id, dt, cause,
                 COUNT(*) OVER (PARTITION BY dt) AS n_type,
                 COUNT(*) OVER (PARTITION BY dt, cause) AS n_cause,
                 DENSE_RANK() OVER (PARTITION BY dt ORDER BY cause) AS rk
          FROM (
            SELECT id, COALESCE(death_type, 'Unknown') AS dt, COALESCE(wl_cause, 'Cause not recorded') AS cause
            FROM df WHERE event_type = 'animal_carcass' AND animal_h = 'Elephant' AND counted = 1
          )
        )
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Elephant Cause and Type of Death Sunburst
    id: mike_bar
    task: draw_incident_sunburst
    mapvalues:
      argnames: df
