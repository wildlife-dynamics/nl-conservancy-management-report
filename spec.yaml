- title: Security
  type: task-group
  description: Security and illegal-activity incidents.
  tasks:
  - name: Security Incidents by Type
    id: security_counts
    task: apply_sql_query
    partial:
      query: |
        SELECT event_type_display AS "Event type", COUNT(*) AS "Incidents"
        FROM df WHERE counted = 1 AND event_type IN ('illegal_activity', 'illegal_activity_rep', 'illegal_activity_rep_ranger',
          'snares_traps', 'poacher_camp', 'poacher_spoor', 'gunshot', 'arrest', 'contact', 'recovered_trophy', 'theft', 'poisoning')
        GROUP BY 1 ORDER BY 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Security Incidents by Type Pie
    id: security_pie
    task: draw_pie_chart
    partial:
      value_column: Incidents
      label_column: Event type
      color_column: null
      plot_style:
        textinfo: value+percent
      layout_style:
        showlegend: true
        legend_title: Event type
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.security_counts.return }}
  - name: Persist Security Incidents by Type Chart
    id: security_pie_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: security_pie_chart
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.security_pie.return }}
  - name: Security Incidents by Type Chart Widget
    id: security_pie_w
    task: create_plot_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Security Incidents by Type
    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.security_pie_html.return }}
  - name: Merge Security Incidents by Type Chart Views
    id: security_pie_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.security_pie_w.return }}
  - name: Security Incident Log
    id: security_events
    task: apply_sql_query
    partial:
      query: |
        SELECT substr(report_time, 1, 16) AS "Date & time",
                CASE WHEN geometry IS NULL OR geometry = 'POINT (0 0)' THEN 'Not recorded'
          ELSE printf('%.5f, %.5f',
            CAST(substr(replace(replace(geometry, 'POINT (', ''), ')', ''), instr(replace(replace(geometry, 'POINT (', ''), ')', ''), ' ') + 1) AS REAL),
            CAST(substr(replace(replace(geometry, 'POINT (', ''), ')', ''), 1, instr(replace(replace(geometry, 'POINT (', ''), ')', ''), ' ') - 1) AS REAL))
        END AS "Coordinates (lat, lon)",
                event_type_display AS "Event type",
                CASE WHEN event_type LIKE 'illegal_activity%' THEN printf('Activity: %s | Suspects: %s', COALESCE(json_extract(event_details, '$."Activity"'), '-'),
                    COALESCE(json_extract(event_details, '$."Number of Suspect(s)"'), json_extract(event_details, '$."Number of suspects"'), '-'))
                ELSE CASE event_type
                  WHEN 'snares_traps' THEN printf('Type: %s | Status: %s | Snares/traps: %s | Species caught: %s', json_extract(event_details, '$."Type"'), json_extract(event_details, '$."Status"'), json_extract(event_details, '$."Total number of snares/traps"'), json_extract(event_details, '$."Species caught"'))
                  WHEN 'poacher_camp' THEN printf('Size: %s | Status: %s | Age: %s | Est. people: %s', json_extract(event_details, '$."Size of camp"'), json_extract(event_details, '$."Camp status"'), json_extract(event_details, '$."Camp age"'), json_extract(event_details, '$."Estimated number of people"'))
                  WHEN 'poacher_spoor' THEN printf('Source: %s | Age (h): %s | Direction: %s', json_extract(event_details, '$."Type of footwear or Vehicle source"'), json_extract(event_details, '$."Age (hours)"'), json_extract(event_details, '$."Direction of travel"'))
                  WHEN 'gunshot' THEN printf('Shots: %s | Type: %s | Distance: %s | Suspected activity: %s', json_extract(event_details, '$."Number of shots"'), json_extract(event_details, '$."Type of shot"'), json_extract(event_details, '$."Estimated distance"'), json_extract(event_details, '$."Suspected activity"'))
                  WHEN 'arrest' THEN printf('Reason: %s | Arrested: %s | Police station: %s', json_extract(event_details, '$."Reason for arrest"'), json_extract(event_details, '$."Total number of people arrested"'), json_extract(event_details, '$."Receiving police station"'))
                  WHEN 'contact' THEN printf('Suspects: %s | Targeted: %s | Casualties: %d | Fatalities: %d', json_extract(event_details, '$."Number of suspects"'), json_extract(event_details, '$."Targeted Group(s)"'),
                    COALESCE(CAST(json_extract(event_details, '$."Rangers injured"') AS REAL), 0) + COALESCE(CAST(json_extract(event_details, '$."Suspects injured"') AS REAL), 0) + COALESCE(CAST(json_extract(event_details, '$."Civilians injured"') AS REAL), 0) + COALESCE(CAST(json_extract(event_details, '$."Police injured"') AS REAL), 0),
                    COALESCE(CAST(json_extract(event_details, '$."Rangers killed"') AS REAL), 0) + COALESCE(CAST(json_extract(event_details, '$."Suspects killed"') AS REAL), 0) + COALESCE(CAST(json_extract(event_details, '$."Civilians killed"') AS REAL), 0) + COALESCE(CAST(json_extract(event_details, '$."Police killed"') AS REAL), 0))
                  WHEN 'recovered_trophy' THEN printf('Trophy: %s | Weight (kg): %s', json_extract(event_details, '$."Trophy type"'), json_extract(event_details, '$."Trophy weight (kg)"'))
                  WHEN 'theft' THEN CASE WHEN json_extract(event_details, '$."Livestock"[0]') IS NULL THEN 'No details recorded'
                    ELSE printf('Livestock: %s | Number: %s | Recovered: %s', COALESCE(json_extract(event_details, '$."Livestock"[0]."Species"'), '-'),
                      COALESCE(json_extract(event_details, '$."Livestock"[0]."Number of livestock"'), '-'),
                      COALESCE(json_extract(event_details, '$."Livestock"[0]."Number of livestock recovered"'), '-')) END
                  WHEN 'poisoning' THEN printf('Motive: %s | Species: %s | Count: %s | Arrest made: %s', json_extract(event_details, '$."Suspected motive"'), json_extract(event_details, '$."Species affected"'), json_extract(event_details, '$."Total count"'), json_extract(event_details, '$."Arrest made?"'))
                END END AS "Details"
         FROM df WHERE counted = 1 AND event_type IN ('illegal_activity', 'illegal_activity_rep', 'illegal_activity_rep_ranger', 'snares_traps', 'poacher_camp', 'poacher_spoor', 'gunshot', 'arrest', 'contact', 'recovered_trophy', 'theft', 'poisoning')
         ORDER BY report_time
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Security Incident Log Table
    id: security_log_tbl
    task: draw_table
    partial:
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: false
        enable_download: true
        hide_header: false
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.security_events.return }}
  - name: Persist Security Incident Log Table
    id: security_log_tbl_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: security_log_table
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.security_log_tbl.return }}
  - name: Security Incident Log Table Widget
    id: security_log_tbl_w
    task: create_table_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Security Incident Log
    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.security_log_tbl_html.return }}
  - name: Merge Security Incident Log Table Views
    id: security_log_tbl_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.security_log_tbl_w.return }}
- title: Human-Wildlife Conflict
  type: task-group
  description: HWC incidents (wildlife-caused damage and conflict injuries / deaths).
  tasks:
  - name: HWC Totals
    id: hwc_kpis
    task: apply_sql_query
    partial:
      query: |
        SELECT COALESCE(SUM(is_conflict), 0) AS "HWC incidents",
               COALESCE(SUM(is_conflict = 1 AND event_type = 'human_injury'), 0) AS "People injured",
               COALESCE(SUM(is_conflict = 1 AND event_type = 'human_death'), 0) AS "People killed",
               CAST(COALESCE(SUM(CASE WHEN event_type = 'hwc_livestock_predation'
                    THEN COALESCE(CAST(json_extract(event_details, '$."Total livestock injured"') AS REAL), 0) END), 0) AS INTEGER) AS "Livestock injured",
               CAST(COALESCE(SUM(CASE WHEN event_type = 'hwc_livestock_predation'
                    THEN COALESCE(CAST(json_extract(event_details, '$."Total livestock dead"') AS REAL), 0) END), 0) AS INTEGER) AS "Livestock killed",
               COALESCE(SUM(CASE WHEN is_conflict = 1 THEN ret_taken ELSE 0 END), 0) AS "Retaliation incidents"
        FROM df
      columns: null
      sanitize: true
    mapvalues:
