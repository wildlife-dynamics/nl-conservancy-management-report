- title: Security
  type: task-group
  description: Security and illegal-activity incidents.
  tasks:
  # SQL notes:
  # One "Illegal Activity" slice: the legacy Ranger Basic form and the
  # current one share the harmonised name (see Prepare Events).
  - name: Security Incidents by Type
    id: security_counts
