    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.mandate_tbl_html.return }}
  - name: Merge Effort by Mandate Table Views
    id: mandate_tbl_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.mandate_tbl_w.return }}
  - name: Ranger Summary
    id: ranger_summary
    task: apply_sql_query
    partial:
      query: |
        SELECT ranger AS "Ranger", COUNT(DISTINCT patrol_id) AS "Patrols",
               ROUND(SUM(distance_km), 1) AS "Distance (km)",
               ROUND(SUM(duration_h), 1) AS "Duration (hours)"
        FROM (
          -- Team leader plus up to ten team members per patrol. Positions are read
          -- directly rather than with json_each, which the task's SQLite sandbox may
          -- refuse to construct.
          SELECT patrol_id, team_leader AS ranger, distance_km, duration_h FROM df WHERE team_leader NOT IN ('No Patrol Info', 'Not recorded')
          UNION SELECT patrol_id, json_extract(team_members, '$[0]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
          UNION SELECT patrol_id, json_extract(team_members, '$[1]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
          UNION SELECT patrol_id, json_extract(team_members, '$[2]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
          UNION SELECT patrol_id, json_extract(team_members, '$[3]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
          UNION SELECT patrol_id, json_extract(team_members, '$[4]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
          UNION SELECT patrol_id, json_extract(team_members, '$[5]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
          UNION SELECT patrol_id, json_extract(team_members, '$[6]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
          UNION SELECT patrol_id, json_extract(team_members, '$[7]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
          UNION SELECT patrol_id, json_extract(team_members, '$[8]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
          UNION SELECT patrol_id, json_extract(team_members, '$[9]'), distance_km, duration_h FROM df WHERE json_valid(team_members)
        ) AS roster
        WHERE ranger IS NOT NULL AND ranger <> ''
        GROUP BY ranger ORDER BY 3 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.patrols_grouped.return }}
  - name: Draw Effort by Ranger Table
    id: ranger_tbl
    task: draw_table
    partial:
      columns: null
      table_config:
        enable_sorting: true
        enable_filtering: false
        enable_download: true
        hide_header: false
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.ranger_summary.return }}
  - name: Persist Effort by Ranger Table
    id: ranger_tbl_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: ranger_table
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.ranger_tbl.return }}
  - name: Effort by Ranger Table Widget
    id: ranger_tbl_w
    task: create_table_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Effort by Ranger
    map:
      argnames:
      - view
      - data
