    partial:
      df: ${{ workflow.patrol_obs_clean.return }}
      roi_gdf: null
      roi_name: null
      reset_index: false
      bounding_box: ${{ workflow.traj_bbox.return }}
      filter_point_coords: ${{ workflow.traj_bad_coords.return }}
  # Segment limits from the run form (Trajectory Filter); see rjsf-overrides.
  - name: Patrol Trajectories
    id: patrol_traj
