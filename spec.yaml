id: nl_conservancy_management_report
requirements:
- name: ecoscope-platform
  version: '>=2.28.0, <2.29.0'
  channel: https://repo.prefix.dev/ecoscope-workflows/
- name: ecoscope-workflows-ext-custom
  version: 0.1.5
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: pydeck
  version: 0.9.2
  channel: conda-forge
rjsf-overrides:
  properties:
    # `set_string_var`'s only argument is `var`, declared with `Field(title="")`,
    # so the run form had nothing to label it with and fell back to the argument
    # name.
    prepared_by.properties.var.title: Prepared by
    prepared_by.properties.var.description: >-
      Type in the name of the user preparing the analysis - this will appear in
      the report.
    # THE PERIOD GROUPING IS A FORM FIELD, NOT A PINNED CONSTANT.
    #
    # Review: "please can you add the temporal grouper to the config instead of
    # having it encoded within the workflow". It used to be
    # `partial: {groupers: [{temporal_index: '%Y-%m'}]}` on set_groupers, which
    # hard-wired one view per calendar month and gave the run form nothing to
    # set.
    #
    # Constrained to TemporalGrouper, the same way incidents_reports constrains
    # its own field to ValueGrouper. Without this the field offers Value and
    # Spatial groupers too, and either one would split on a column this
    # workflow never builds -- a run-time failure on a choice the form invited.
    #
    # The default keeps month-by-month as the out-of-box behaviour, so an
    # untouched form produces exactly the report that was there before.
    groupers.properties.groupers.title: Report period grouping
    groupers.properties.groupers.description: >-
      How the report is broken down. Year and Month gives one view per calendar
      month, which is what a monthly management report expects. Leave empty for
      a single view covering the whole time range.
    groupers.properties.groupers.default:
    - temporal_index: '%Y-%m'
    groupers.properties.groupers.items.anyOf:
    - $ref: '#/$defs/TemporalGrouper'
    base_map_defs.properties.base_maps.default:
    - url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}
      opacity: 1
    - url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
      opacity: 0.5
task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
workflow:
- name: Workflow Details
  id: workflow_details
  task: set_workflow_details
- name: Data Source
  id: er_client_name
  task: set_er_connection
- name: Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y'
- name: Extract Timezone
  id: get_timezone
  task: get_timezone_from_time_range
  partial:
    time_range: ${{ workflow.time_range.return }}
# MRD, Header & period: "Report generated by (Ecoscope user)". A form field,
# not a pinned constant.
#
# TOP LEVEL, NOT IN A TASK-GROUP, and that matters. While this sat inside a
# "Report Details" task-group it was the only form field in one, and the
# generated rjsf.json nested it under a group node whose `title` was null
# while params.json kept it at the top level. Ecoscope Desktop rendered
# "Error Loading Page" for the entire configuration form. Every other form
# field here is a top-level task, so this one is too.
- name: Prepared By
  id: prepared_by
  task: set_string_var
- name: Base Maps
  id: base_map_defs
  task: set_base_maps
# UNPINNED on review, so the grouping comes from the run form. The default and
# the restriction to temporal groupers are in rjsf-overrides at the top of this
# file.
#
# Nothing downstream needed changing. Every task that groups already reads
# `${{ workflow.groupers.return }}` rather than assuming a month, the
# month-on-month charts derive their month in SQL from the event time rather
# than from the grouping, and the Word template loops over grouped values, so
# one view or twelve both render. An empty selection gives the AllGrouper and a
# single whole-period view.
- name: Group by
  id: groupers
  task: set_groupers
- title: Fetch Events
  type: task-group
  description: All events in the period; sections select their event types in SQL.
  tasks:
  - name: Get Events
    id: events_raw
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_types: []
      event_columns: null
      event_states: null
      include_null_geometry: true
      raise_on_empty: false
      include_details: true
      include_updates: false
      include_related_events: false
      include_display_values: true
      force_point_geometry: true
  - name: Process Event Details
    id: events_details
    task: process_events_details
    partial:
      df: ${{ workflow.events_raw.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true
      ordered: true
  - name: Events or Empty Frame
    id: events_safe
    task: concat_dataframes
    skipif:
      conditions: &id002
      - never
    partial:
      dfs:
      - ${{ workflow.events_details.return }}
      reset_index: true
      ensure_columns:
      - id
      - serial_number
      - event_type
      - event_type_display
      - event_category
      - event_details
      - patrols
      - geometry
      - time
  - name: Prepare Events
    id: events_prepared
    task: apply_sql_query
    skipif:
      conditions: &id001
      - any_dependency_skipped
    partial:
      df: ${{ workflow.events_safe.return }}
      query: |
        SELECT id, serial_number, event_type, event_type_display, event_category,
               event_details, patrols, geometry,
               strftime('%Y-%m-%dT%H:%M:%SZ', COALESCE(
                 CASE
                   WHEN event_type IN ('human_injury', 'crop_damage', 'infrastructure_damage') THEN json_extract(event_details, '$."Incident date & time"')
                   WHEN event_type = 'poisoning' THEN json_extract(event_details, '$."Date & time"')
                   WHEN event_type = 'arrest' THEN json_extract(event_details, '$."Arrest time"')
                   WHEN event_type = 'contact' THEN json_extract(event_details, '$."Contact time"')
                 END,
                 time)) AS report_time,
               -- Not counted as field events: logistics, device check-ins (Silent
               -- Source), test forms, and legacy records that were migrated to a new
               -- type (the copy names its original in additional.migrated_from_event_id).
               CASE WHEN event_category IN ('logistics', 'analyzer_event', 'test')
                      OR event_type IN ('test_patrol_info', 'patrol_info', 'meeting_rep', 'meeting_report',
                                        'livestock_household_survey', 'silence_source_rep')
                      OR id IN (SELECT json_extract(event_details, '$."additional"."migrated_from_event_id"') FROM df
                                WHERE json_extract(event_details, '$."additional"."migrated_from_event_id"') IS NOT NULL)
                    THEN 0 ELSE 1 END AS counted,
               CASE
                 WHEN event_type = 'hwc_livestock_predation' THEN 1
                 WHEN event_type = 'human_injury' AND json_extract(event_details, '$."Cause of injury"') = 'Human-wildlife conflict' THEN 1
                 WHEN event_type = 'human_death' AND json_extract(event_details, '$."Cause"') = 'Human-wildlife conflict' THEN 1
                 WHEN event_type IN ('crop_damage', 'infrastructure_damage') AND json_extract(event_details, '$."Cause of damage"') = 'Wildlife' THEN 1
                 WHEN event_type IN ('animal_carcass', 'sick_injured_animal') AND death_type = 'Conflict' THEN 1
                 WHEN event_type = 'poisoning' AND json_extract(event_details, '$."Suspected motive"') = 'HWC retaliation' THEN 1
                 ELSE 0
               END AS is_conflict,
               CASE event_type
                 WHEN 'hwc_livestock_predation' THEN 'Livestock predation'
                 WHEN 'human_injury' THEN 'Human injury'
                 WHEN 'human_death' THEN 'Human death'
                 WHEN 'crop_damage' THEN 'Crop damage'
                 WHEN 'infrastructure_damage' THEN 'Infrastructure damage'
                 WHEN 'animal_carcass' THEN 'Wildlife death'
                 WHEN 'sick_injured_animal' THEN 'Wildlife injury'
                 WHEN 'poisoning' THEN 'Poisoning'
                 ELSE event_type_display
               END AS conflict_type,
               -- species_h: the animal RESPONSIBLE (HWC forms). animal_h: the animal
               -- seen, found dead or hurt (sightings, carcasses, sick / injured).
               CASE WHEN event_type IN ('hwc_livestock_predation', 'crop_damage', 'infrastructure_damage',
                                        'human_injury', 'human_death') THEN sp_h ELSE 'Unknown' END AS species_h,
               CASE WHEN event_type IN ('animal_carcass', 'sick_injured_animal', 'wildlife_sighting') THEN sp_h END AS animal_h,
               death_type,
               COALESCE(json_extract(event_details, '$."Cause of Death (CONFLICT)"'), json_extract(event_details, '$."Cause of Injury (CONFLICT)"'),
                        json_extract(event_details, '$."Cause of Death (POACHED)"'), json_extract(event_details, '$."Cause of Injury (POACHED)"'),
                        json_extract(event_details, '$."Cause of Death (PAC)"'), json_extract(event_details, '$."Cause of Injury (PAC)"'),
                        json_extract(event_details, '$."Cause of Death (NATURAL)"'), json_extract(event_details, '$."Cause of Injury (NATURAL)"'),
                        json_extract(event_details, '$."Cause of Injury (UNKNOWN)"'),
                        json_extract(event_details, '$."Cause of Death"'), json_extract(event_details, '$."Cause of Injury"')) AS wl_cause,
               CASE WHEN COALESCE(json_extract(event_details, '$."Retaliation action taken?"'), json_extract(event_details, '$."Retaliation action taken"'))
                         IN (1, 'true', 'True', 'Yes') THEN 1 ELSE 0 END AS ret_taken,
               CASE WHEN COALESCE(json_extract(event_details, '$."Retaliation action threatened?"'), json_extract(event_details, '$."Retaliation action threatened"'))
                         IN (1, 'true', 'True', 'Yes') THEN 1 ELSE 0 END AS ret_threatened,
               NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(CAST(COALESCE(json_extract(event_details, '$."Action"'),
                 json_extract(event_details, '$."Action taken"'), json_extract(event_details, '$."Action Taken"')) AS TEXT),
                 '","', ', '), '["', ''), '"]', ''), '[]', '')), '') AS action_txt
        FROM (
          SELECT *,
                 CASE
                   WHEN sp2 IS NULL OR sp2 = '' THEN 'Unknown'
                   WHEN LOWER(sp2) IN ('baboon, olive', 'baboon olive', 'olive baboon') THEN 'Olive Baboon'
                   WHEN LOWER(sp2) IN ('hyena, spotted', 'hyena spotted', 'spotted hyena') THEN 'Spotted Hyena'
                   WHEN LOWER(sp2) IN ('hyena, striped', 'hyena striped', 'striped hyena') THEN 'Striped Hyena'
                   WHEN LOWER(sp2) IN ('zebra, burchells', 'burchells zebra') THEN 'Burchells Zebra'
                   WHEN LOWER(sp2) IN ('zebra, grevys', 'grevys zebra', 'grevy''s zebra') THEN 'Grevys Zebra'
                   WHEN LOWER(sp2) IN ('gazelle, grants', 'grants gazelle') THEN 'Grants Gazelle'
                   WHEN LOWER(sp2) IN ('gazelle, thompsons', 'thompsons gazelle') THEN 'Thompsons Gazelle'
                   WHEN LOWER(sp2) IN ('kudu, lesser', 'lesser kudu') THEN 'Lesser Kudu'
                   WHEN LOWER(sp2) IN ('kudu, greater', 'greater kudu') THEN 'Greater Kudu'
                   WHEN LOWER(sp2) IN ('jackal, side striped', 'side striped jackal', 'side-striped jackal') THEN 'Side-striped Jackal'
                   WHEN LOWER(sp2) IN ('jackal, black backed', 'black backed jackal', 'black-backed jackal') THEN 'Black-backed Jackal'
                   ELSE UPPER(SUBSTR(sp2, 1, 1)) || SUBSTR(sp2, 2)
                 END AS sp_h
          FROM (
            -- "Hyena - Spotted" -> "Spotted Hyena"
            SELECT *, CASE WHEN INSTR(sp1, ' - ') > 0
                           THEN TRIM(SUBSTR(sp1, INSTR(sp1, ' - ') + 3)) || ' ' || TRIM(SUBSTR(sp1, 1, INSTR(sp1, ' - ') - 1))
                           ELSE sp1 END AS sp2
            FROM (
              -- ER labels are bilingual ("Lion / Simba"): keep the English half.
              SELECT *, TRIM(CASE WHEN INSTR(sp_raw, ' / ') > 0 THEN SUBSTR(sp_raw, 1, INSTR(sp_raw, ' / ') - 1) ELSE sp_raw END) AS sp1,
                     -- Carcass and Sick / Injured choice labels are long ("Conflict -
                     -- fill in relevant HWC form", "Problem Animal Control / Management").
                     CASE WHEN event_type IN ('animal_carcass', 'sick_injured_animal') THEN
                       CASE WHEN dt LIKE 'Poach%' THEN 'Poached' WHEN dt LIKE 'Conflict%' THEN 'Conflict'
                            WHEN dt LIKE 'Natural%' THEN 'Natural' WHEN dt LIKE 'Problem Animal%' OR dt LIKE 'PAC%' THEN 'PAC/Management'
                            ELSE 'Unknown' END END AS death_type
              FROM (
                SELECT *,
                       CASE WHEN event_type IN ('human_injury', 'human_death')
                              THEN COALESCE(json_extract(event_details, '$."Species responsible"'), json_extract(event_details, '$."Species Responsible"'))
                            ELSE json_extract(event_details, '$."Species"') END AS sp_raw,
                       COALESCE(json_extract(event_details, '$."Type of Death"'), json_extract(event_details, '$."Type of Injury"')) AS dt
                FROM df
              )
            )
          )
        )
      columns: null
      sanitize: true
  - name: Parse Report Time
    id: events_time
    task: extract_column_as_type
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.events_prepared.return }}
      column_name: report_time
      output_type: datetime
      output_column_name: report_time
      fan_out: true
  - name: Convert Events to Timezone
    id: events_tz
    task: convert_values_to_timezone
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.events_time.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
      - report_time
      auto_detect: false
  - name: Add Event Month Index
    id: events_indexed
    task: add_temporal_index
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.events_tz.return }}
      time_col: report_time
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed
  - name: Split Events by Month
    id: events_grouped
    task: split_groups
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.events_indexed.return }}
      groupers: ${{ workflow.groupers.return }}
- title: Fetch Patrols
  type: task-group
  description: All done patrols in the period, with their GPS tracks.
  tasks:
  - name: Set Patrol Query
    id: patrol_params
    task: set_patrols_and_patrol_events_params
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      patrol_types: []
      event_types: []
      status:
      - done
      event_states: null
      include_patrol_details: true
      raise_on_empty: false
      include_null_geometry: true
      truncate_to_time_range: true
      sub_page_size: 100
      patrols_overlap_daterange: true
  - name: Get Patrols
    id: patrols_raw
    task: get_patrols_from_combined_params
    partial:
      combined_params: ${{ workflow.patrol_params.return }}
  - name: Get Patrol Observations
    id: patrol_obs
    task: get_patrol_observations_from_patrols_df_and_combined_params
    partial:
      patrols_df: ${{ workflow.patrols_raw.return }}
      combined_params: ${{ workflow.patrol_params.return }}
  - name: Remove Observation Prefix
    id: patrol_obs_clean
    task: drop_column_prefix
    partial:
      df: ${{ workflow.patrol_obs.return }}
      prefix: extra__
      duplicate_strategy: suffix
  - name: Filter Observation Coordinates
    id: patrol_obs_filtered
    task: apply_reloc_coord_filter
    partial:
      df: ${{ workflow.patrol_obs_clean.return }}
      roi_gdf: null
      roi_name: null
      reset_index: false
      bounding_box:
        min_x: -180.0
        max_x: 180.0
        min_y: -90.0
        max_y: 90.0
      filter_point_coords:
      - x: 180.0
        y: 90.0
      - x: 0.0
        y: 0.0
      - x: 1.0
        y: 1.0
  - name: Patrol Trajectories
    id: patrol_traj
    task: relocations_to_trajectory
    partial:
      relocations: ${{ workflow.patrol_obs_filtered.return }}
      trajectory_segment_filter:
        min_length_meters: 0.001
        max_length_meters: 100000
        min_time_secs: 1
        max_time_secs: 172800
        min_speed_kmhr: 0.01
        max_speed_kmhr: 500
  - name: Remove Trajectory Prefix
    id: patrol_traj_clean
    task: drop_column_prefix
    partial:
      df: ${{ workflow.patrol_traj.return }}
      prefix: extra__
      duplicate_strategy: suffix
- title: Patrol Table
  type: task-group
  description: 'One row per patrol: type, duration, distance and Patrol Info attributes.'
  tasks:
  - name: Tracks or Empty Frame
    id: traj_safe
    task: concat_dataframes
    skipif:
      conditions: *id002
    partial:
      dfs:
      - ${{ workflow.patrol_traj_clean.return }}
      reset_index: false
      ensure_columns:
      - patrol_id
      - patrol_type__display
      - patrol_serial_number
      - speed_kmhr
      - dist_meters
      - timespan_seconds
      - segment_start
      - segment_end
      - geometry
  - name: Patrols or Empty Frame
    id: patrols_safe
    task: concat_dataframes
    skipif:
      conditions: *id002
    partial:
      dfs:
      - ${{ workflow.patrols_raw.return }}
      reset_index: true
      ensure_columns:
      - id
      - serial_number
      - title
      - patrol_segments
  - name: Patrol Track Totals
    id: patrol_tracks
    task: apply_sql_query
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.traj_safe.return }}
      query: |
        SELECT patrol_id,
               MAX(patrol_type__display) AS patrol_type,
               COUNT(*) AS n_segments,
               SUM(dist_meters) / 1000.0 AS distance_km,
               SUM(timespan_seconds) / 3600.0 AS tracked_hours
        FROM df GROUP BY patrol_id
      columns: null
      sanitize: true
  - name: Patrol Serials
    id: patrols_master
    task: apply_sql_query
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrols_safe.return }}
      query: |
        SELECT id AS patrol_id, serial_number AS patrol_serial, title AS patrol_title,
               json_extract(patrol_segments, '$[0].patrol_type') AS patrol_type_slug,
               strftime('%Y-%m-%dT%H:%M:%SZ', json_extract(patrol_segments, '$[0].time_range.start_time')) AS start_time,
               (julianday(json_extract(patrol_segments, '$[0].time_range.end_time'))
                 - julianday(json_extract(patrol_segments, '$[0].time_range.start_time'))) * 24.0 AS patrol_hours
        FROM df
      columns: null
      sanitize: true
  - name: Patrol Info Attributes
    id: patrol_info
    task: apply_sql_query
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.events_prepared.return }}
      query: |
        SELECT json_extract(patrols, '$[0]') AS patrol_id,
               MAX(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(CAST(json_extract(event_details, '$."Mandate"') AS TEXT),
                   '","', ', '), '["', ''), '"]', ''), '[]', '')), '')) AS mandate,
               MAX(json_extract(event_details, '$."Station"')) AS station,
               MAX(json_extract(event_details, '$."Transport Type"')) AS transport,
               MAX(json_extract(event_details, '$."Team Leader"')) AS team_leader,
               MAX(json(json_extract(event_details, '$."Team members"'))) AS team_members,
               1 AS has_patrol_info
        FROM df
        WHERE event_type IN ('test_patrol_info', 'patrol_info') AND json_array_length(patrols) > 0
        GROUP BY 1
      columns: null
      sanitize: true
  - name: Join Track Totals
    id: patrols_tracks
    task: ecoscope_workflows_ext_custom.tasks.transformation.merge_two_dataframes
    skipif:
      conditions:
      - any_dependency_skipped
    partial:
      left: ${{ workflow.patrols_master.return }}
      right: ${{ workflow.patrol_tracks.return }}
      how: left
      'on': patrol_id
      left_on: null
      right_on: null
      left_index: false
      right_index: false
      fillna_value: null
  - name: Join Patrol Info
    id: patrols_info
    task: ecoscope_workflows_ext_custom.tasks.transformation.merge_two_dataframes
    skipif:
      conditions:
      - any_dependency_skipped
    partial:
      left: ${{ workflow.patrols_tracks.return }}
      right: ${{ workflow.patrol_info.return }}
      how: left
      'on': patrol_id
      left_on: null
      right_on: null
      left_index: false
      right_index: false
      fillna_value: null
  - name: Build Patrol Table
    id: patrol_table
    task: apply_sql_query
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrols_info.return }}
      query: |
        SELECT patrol_id, patrol_serial, patrol_title,
               COALESCE(patrol_type, patrol_type_slug, 'Unknown') AS patrol_type,
               start_time,
               ROUND(COALESCE(distance_km, 0), 3) AS distance_km,
               ROUND(COALESCE(patrol_hours, tracked_hours, 0), 3) AS duration_h,
               COALESCE(n_segments, 0) AS n_segments,
               CASE WHEN COALESCE(has_patrol_info, 0) = 0 THEN 'No Patrol Info' ELSE COALESCE(mandate, 'Not recorded') END AS mandate,
               CASE WHEN COALESCE(has_patrol_info, 0) = 0 THEN 'No Patrol Info' ELSE COALESCE(transport, 'Not recorded') END AS transport,
               CASE WHEN COALESCE(has_patrol_info, 0) = 0 THEN 'No Patrol Info' ELSE COALESCE(station, 'Not recorded') END AS station,
               CASE WHEN COALESCE(has_patrol_info, 0) = 0 THEN 'No Patrol Info' ELSE COALESCE(team_leader, 'Not recorded') END AS team_leader,
               team_members,
               COALESCE(has_patrol_info, 0) AS has_patrol_info
        FROM df
        WHERE COALESCE(patrol_type_slug, '') <> 'test_patrol'
      columns: null
      sanitize: true
  - name: Parse Patrol Start
    id: patrol_table_time
    task: extract_column_as_type
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrol_table.return }}
      column_name: start_time
      output_type: datetime
      output_column_name: start_time
      fan_out: true
  - name: Convert Patrols to Timezone
    id: patrol_table_tz
    task: convert_values_to_timezone
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrol_table_time.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
      - start_time
      auto_detect: false
  - name: Add Patrol Month Index
    id: patrols_indexed
    task: add_temporal_index
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrol_table_tz.return }}
      time_col: start_time
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed
  - name: Split Patrols by Month
    id: patrols_grouped
    task: split_groups
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.patrols_indexed.return }}
      groupers: ${{ workflow.groupers.return }}
  - name: Convert Tracks to Timezone
    id: traj_tz
    task: convert_values_to_timezone
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.traj_safe.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
      - segment_start
      - segment_end
      auto_detect: false
  - name: Patrol Type Colours
    id: traj_colors
    task: apply_color_map
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.traj_tz.return }}
      input_column_name: patrol_type__display
      colormap:
      - '#1b9e77'
      - '#d95f02'
      - '#7570b3'
      - '#e7298a'
      - '#66a61e'
      - '#e6ab02'
      output_column_name: patrol_type_color
  - name: Add Track Month Index
    id: traj_indexed
    task: add_temporal_index
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.traj_colors.return }}
      time_col: segment_start
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed
  - name: Split Tracks by Month
    id: traj_grouped
    task: split_groups
    skipif:
      conditions: *id001
    partial:
      df: ${{ workflow.traj_indexed.return }}
      groupers: ${{ workflow.groupers.return }}
