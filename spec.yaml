- title: Wildlife Monitoring
  type: task-group
  description: Sightings by species, with a proportional-symbol map.
  tasks:
  - name: Wildlife Summary
    id: wildlife_summary
    task: apply_sql_query
    partial:
      query: |
        SELECT COALESCE(animal_h, 'Unspecified') AS "Species",
               SUM(CASE WHEN COALESCE(json_extract(event_details, '$."Sighting type"'), 'Visual') = 'Visual' THEN 1 ELSE 0 END) AS "Sightings (visual)",
               CAST(SUM(CASE WHEN COALESCE(json_extract(event_details, '$."Sighting type"'), 'Visual') = 'Visual'
                             THEN COALESCE(CAST(json_extract(event_details, '$."Total Individuals"') AS REAL), 0) ELSE 0 END) AS INTEGER) AS "Individuals observed",
               SUM(CASE WHEN json_extract(event_details, '$."Sighting type"') IN ('Spoor', 'Dung/Pellets') THEN 1 ELSE 0 END) AS "Signs (spoor or dung)"
        FROM df WHERE event_type = 'wildlife_sighting'
        GROUP BY 1 ORDER BY 3 DESC, 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Wildlife Sightings by Species Table
