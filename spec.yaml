  - name: Merge Illegally Killed Elephants Views
    id: mike_kpi_2_svw
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.mike_kpi_2_sv.return }}
  - name: Elephant Cause of Death
    id: mike_by_cause
    task: apply_sql_query
    partial:
      query: |
        SELECT g."Cause of death" AS "Cause of death",
               ty."Type of death" AS "Type of death",
               COALESCE(SUM(CASE WHEN c.cause IS NULL THEN 0
                                 WHEN c.type = ty."Type of death" THEN 1
                                 ELSE 0 END), 0) AS "Carcasses"
        FROM (
          SELECT COALESCE(wl_cause, 'Not recorded') AS "Cause of death"
          FROM df WHERE event_type = 'animal_carcass' AND animal_h = 'Elephant'
          GROUP BY 1
        ) g
        CROSS JOIN (
                    SELECT 'Conflict' AS "Type of death"
          UNION ALL SELECT 'Natural'
          UNION ALL SELECT 'PAC/Management'
          UNION ALL SELECT 'Poached'
          UNION ALL SELECT 'Unknown'
        ) ty
        LEFT JOIN (
          SELECT COALESCE(wl_cause, 'Not recorded') AS cause,
                 COALESCE(death_type, 'Unknown') AS type
          FROM df WHERE event_type = 'animal_carcass' AND animal_h = 'Elephant'
        ) c ON c.cause = g."Cause of death"
        GROUP BY 1, 2 ORDER BY 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # STACKED, via draw_chart.
  #
  # draw_bar_chart CANNOT stack: it builds go.Figure(layout=LayoutStyle), and
  # LayoutStyle has no barmode field, so pydantic drops any `barmode` handed to
  # layout_kwargs without a word and the chart renders grouped. draw_chart
  # takes barmode as a real argument, which is why the query above now emits
  # one row per (cause, type of death) instead of a column per type.
  #
  # The scaffold matters for colour as much as for completeness: draw_chart
  # cycles `palette` over the series in sorted order with no way to key it by
  # label, so a period with no Poached carcasses would otherwise hand Poached's
  # indigo to the next series along.
  - name: Draw Elephant Cause and Type of Death Bar Chart
    id: mike_bar
    task: draw_chart
    partial:
      x_axis: Cause of death
      figures:
      - metric: {display_name: Carcasses, aggregator: sum, column: Carcasses, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Type of death
      time_breakdown: null
      barmode: stack
      # Sorted: Conflict, Natural, PAC/Management, Poached, Unknown.
      palette: ['#b62879', '#ff803e', '#ed3ea2', '#3e35a3', '#3089ff']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Type of death
        xaxis: {title: Cause of death}
        yaxis: {title: Elephant carcasses}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.mike_by_cause.return }}
  - name: Persist Elephant Cause and Type of Death Chart
    id: mike_bar_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: mike_bar_chart
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.mike_bar.return }}
  - name: Elephant Cause and Type of Death Chart Widget
    id: mike_bar_w
    task: create_plot_widget_single_view
    skipif:
      conditions: *id002
    partial:
      title: Elephant Cause and Type of Death
    map:
      argnames:
      - view
      - data
      argvalues: ${{ workflow.mike_bar_html.return }}
  - name: Merge Elephant Cause and Type of Death Chart Views
    id: mike_bar_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.mike_bar_w.return }}
  - name: Elephant Carcass Points
    id: mike_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry,
               COALESCE(death_type, 'Unknown') AS "Type of death",
               COALESCE(wl_cause, 'Not recorded') AS "Cause of death",
               json_extract(event_details, '$."Tusk Status"') AS "Tusk status",
               substr(report_time, 1, 16) AS "Date"
        FROM df WHERE event_type = 'animal_carcass' AND animal_h = 'Elephant' AND geometry IS NOT NULL
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Elephant Carcasses Map Colormap
    id: mike_cmap
    task: apply_color_map
    partial:
      input_column_name: Type of death
      colormap: *id004
      output_column_name: mike_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.mike_points.return }}
  - name: Elephant Carcasses Map Point Layer
    id: mike_layer
    task: create_point_layer
    skipif:
      conditions: *id003
    partial:
      layer_style:
        get_radius: 8.0
        radius_units: pixels
        fill_color_column: mike_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.85
      legend:
        label_column: Type of death
        color_column: mike_color
      tooltip_columns:
      - Type of death
      - Cause of death
      - Tusk status
      - Date
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.mike_cmap.return }}
  - name: Draw Elephant Carcasses Map Map
    id: mike_map
