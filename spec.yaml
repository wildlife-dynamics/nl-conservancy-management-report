- title: Downloadable Results
  type: task-group
  description: The CSVs and the Word report, listed in the app's Files tab.
  tasks:
  # WHY THE FILES TAB WAS EMPTY
  #
  # Review: "The workflow has run successfully but there are no downloadable
  # files." Nothing here registered one. persist_text writes the widget HTML
  # and create_docx writes the report, but the Files tab is NOT a directory
  # listing -- it is built from the `files` argument of gather_dashboard, and
  # that argument was absent entirely. So every output existed on disk and the
  # app correctly reported none. Same omission the HWC report had.
  #
  # The chain, per the fleet's download pattern:
  #   persist_grouped_dfs_for_results_download  (writes, returns paths)
  #     -> create_files_single_view             (paths -> a view)
  #       -> merge_file_views                   (views -> GroupedFiles)
  #         -> gather_dashboard(files=...)
  #
  # persist_grouped_dfs_for_results_download rather than persist_df_wrapper:
  # it embeds a 6-char hash of the group key in each filename, which is how the
  # front end matches a file to a dashboard view -- so with the month grouper
  # each month's CSV is offered against that month's view. Its return is a FLAT
  # list of paths across all groups, so it feeds one ungrouped view.
  #
  # Column whitelists, not blacklists, in both queries below. No name, ID
  # number, telephone, date of birth, ethnicity or tribe is selected, so none
  # can reach a file a user downloads and forwards, even if a form adds one of
  # those fields later. Team leader is the documented exception -- crediting
  # rangers is the point of the patrol record, and the user guide says so.
  - name: Event Export
    id: events_export
    task: apply_sql_query
    partial:
      query: |
        SELECT serial_number AS "Serial",
               substr(report_time, 1, 16) AS "Date",
               event_category AS "Category",
               event_type_display AS "Event type",
               species_h AS "Species",
               animal_h AS "Animal",
               death_type AS "Type of death",
               wl_cause AS "Cause",
               conflict_type AS "Conflict type",
               COALESCE(action_txt, '') AS "Action taken",
               geometry AS "Location"
        FROM df WHERE counted = 1
        ORDER BY report_time
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Patrol Export
    id: patrols_export
    task: apply_sql_query
    partial:
      query: |
        SELECT patrol_serial AS "Serial",
               substr(start_time, 1, 16) AS "Start",
               patrol_type AS "Patrol type",
               ROUND(distance_km, 2) AS "Distance (km)",
               ROUND(duration_h, 2) AS "Duration (h)",
               mandate AS "Mandate",
               transport AS "Transport",
               station AS "Station",
               team_leader AS "Team leader"
        FROM df
        ORDER BY start_time
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.patrols_grouped.return }}

  # skipif *never* on every task from here down. These must run even on an
  # empty period: a skipped task returns a SkipSentinel, that object reaches
  # gather_dashboard, and the whole run then dies at response serialization
  # with "Unable to serialize unknown type: SkipSentinel" -- an error that
  # names no task and points at dispatch.py.
  - name: Write Event CSV
    id: export_event_files
    task: persist_grouped_dfs_for_results_download
    skipif:
      conditions: &never [never]
    partial:
      grouped_dfs: ${{ workflow.events_export.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetypes: [csv]
      filename_prefix: naibunga_events
      sanitize: true
  - name: Write Patrol CSV
    id: export_patrol_files
    task: persist_grouped_dfs_for_results_download
    skipif:
      conditions: *never
    partial:
      grouped_dfs: ${{ workflow.patrols_export.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetypes: [csv]
      filename_prefix: naibunga_patrols
      sanitize: true
  - {name: Event CSV Files, id: files_events_view, task: create_files_single_view,
     skipif: {conditions: *never},
     partial: {files: "${{ workflow.export_event_files.return }}"}}
  - {name: Patrol CSV Files, id: files_patrols_view, task: create_files_single_view,
     skipif: {conditions: *never},
     partial: {files: "${{ workflow.export_patrol_files.return }}"}}
  - {name: Word Report File, id: files_report_view, task: create_files_single_view,
     skipif: {conditions: *never},
     partial: {files: "${{ workflow.create_report.return }}"}}
  # The per-chart HTML files are deliberately NOT here. They come from grouped
  # `persist_text` tasks, which return [(CompositeFilter, path)] rather than a
  # path. Consuming that with `map` gives a LIST of FilesListSingleView per
  # chart, and merge_file_views takes list[FilesListSingleView], not a list of
  # lists. Nothing in ecoscope-platform or ext-custom flattens a grouped return
  # into a plain list of paths. Doing it properly needs an upstream task; until
  # then the charts and maps are in the results folder but not the Files tab.
  - name: Merge File Views
    id: files_merged
    task: merge_file_views
    skipif:
      conditions: *never
    partial:
      files:
      - ${{ workflow.files_events_view.return }}
      - ${{ workflow.files_patrols_view.return }}
      - ${{ workflow.files_report_view.return }}

