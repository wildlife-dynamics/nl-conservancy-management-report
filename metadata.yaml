name: Naibunga Lower Conservancy Management Report

# at least one author is required
author:
  - name: "Rodney Omukuti"
    organization: "Wildlife Dynamics"
    email: "rodney@wildlifedynamics.com"

description: >-
  Monthly dashboard and Word report for Naibunga Lower Conservancy: patrol
  effort and coverage, wildlife sightings, animal health and MIKE elephant
  mortality, security incidents, human-wildlife conflict, human injury and
  death, and data-completeness checks, from EarthRanger patrols and events.

theory: >-
  Events are bucketed by month using each event's own incident date where the
  event type records one (Human Injury, Crop and Infrastructure damage:
  Incident date & time; Poisoning: Date & time; Arrest: Arrest time; Contact:
  Contact time), otherwise the EarthRanger event time. Logistics events
  (Patrol Info, Meeting Report) and the Livestock Household Survey are
  excluded from all event totals. PIKE is the share of elephant carcasses
  whose Type of Death is Poached.

output_comment: >-
  One dashboard view per month in the selected period, plus a Word report
  (one table row per month) with map and chart figures.

